<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed the Fart · Rubber Duck Games</title>
<meta name="description" content="Thanksgiving dinner. Feed the plumber from the table, pull his finger, and collect every kind of fart.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2414;--soft:#6b4c33;--bg:#f6e7cc;--panel:#fffaf0;--line:#d9b98a;--accent:#9a3412;--accentDark:#6b230b;font-family:Lexend,Verdana,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);touch-action:manipulation}
body{font-size:1.125rem;line-height:1.45;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:.2rem solid var(--ink);outline-offset:.2rem}
.bar{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;flex-wrap:wrap}
.bar .grow{flex:1}
.pill{background:var(--panel);border:2px solid var(--line);padding:.375rem .875rem;white-space:nowrap;text-decoration:none;color:inherit;font-family:"Press Start 2P",monospace;font-size:.7rem;line-height:1.6;box-shadow:.25rem .25rem 0 var(--line)}
@media (max-width:30rem){.pill{font-size:.55rem;padding:.3rem .5rem}}
main{max-width:64rem;margin:0 auto;padding:0 .75rem 2rem}
.stage{position:relative;max-width:calc(62vh * 800 / 460);margin:0 auto;border:4px solid var(--ink);background:#f1d7a6;box-shadow:.4rem .4rem 0 rgba(0,0,0,.2);overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
#px{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.say{font-family:"Press Start 2P",monospace;font-size:clamp(.5rem,1.5vw,.8rem);line-height:1.6;border-radius:0;box-shadow:.2rem .2rem 0 rgba(0,0,0,.35)}
/* speech bubbles sit over the picture, placed in % of it so they follow its size */
.say{position:absolute;background:#fff;color:#1d120a;border:3px solid #1d120a;border-radius:1rem;padding:.35rem .7rem;font-weight:600;font-size:clamp(.8rem,2.4vw,1.15rem);line-height:1.3;max-width:42%;pointer-events:none}
.say::after{content:"";position:absolute;left:1rem;bottom:-.75rem;border:.6rem solid transparent;border-top-color:#1d120a;border-bottom:0}
#sayHim{left:22%;top:6%}
#sayRoom{right:3%;top:4%}
#sayRoom::after{left:auto;right:1.5rem}
#sayDoor{left:2%;top:8%}
.controls{display:flex;gap:1rem;align-items:center;margin:1rem 0 .4rem;flex-wrap:wrap}
.meterbox{flex:1;min-width:14rem}
.meterbox label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:.3rem}
.meter{height:1.6rem;border:3px solid var(--ink);background:var(--panel);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7aa83a,#e0a526 60%,#c2410c);transition:width .4s}
.pull{background:var(--accent);color:#fff;font-family:"Press Start 2P",monospace;font-size:.85rem;line-height:1.6;padding:1rem 1.2rem;box-shadow:0 .35rem 0 var(--accentDark);margin-left:auto}
.pull:disabled{background:#c9b597;color:#4a3826;box-shadow:0 .35rem 0 #a8916f;cursor:default}
.pull.ready{animation:beg 1s ease-in-out infinite}
.pull:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .1rem 0 var(--accentDark)}
@keyframes beg{50%{transform:scale(1.06)}}
.hint{color:var(--soft);margin:.2rem 0 .8rem;font-size:1rem}
.snacksH{font-family:"Press Start 2P",monospace;font-size:.8rem;line-height:1.6;margin:1.4rem 0 .6rem}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem}
/* On a phone the foods scrolled the table off screen while you picked; the
   scene, meter and button stay pinned and the foods scroll under them. */
@media (max-width:40rem){.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:.25rem}.foods{grid-template-columns:repeat(3,1fr)}.food{font-size:.8rem;min-height:4.5rem;padding:.4rem .2rem}.food .e{width:3rem;height:3rem}.controls{margin:.6rem 0 .2rem;gap:.6rem}.pull{padding:.8rem 1rem;font-size:.75rem}.hint{font-size:.9rem;margin:.2rem 0 .5rem}}
.food{background:var(--panel);border:3px solid var(--line);border-radius:.6rem;padding:.5rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;text-align:center;line-height:1.25;font-size:.95rem;min-height:5.5rem}
.food .e{width:4rem;height:4rem;image-rendering:pixelated}
.food .d{font-size:.75rem;color:var(--soft)}
.food:hover:not(:disabled){border-color:var(--accent)}
.food:disabled{opacity:.5;cursor:default}
/* a locked snack stays readable (full contrast), marked by a dashed border instead of fading */
.food[data-lock="true"]{opacity:1;background:#efe3cc;border-style:dashed;border-color:#8a7355}
/* the house (top-down, decided 20 Nov) */
.hhud{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;margin:.2rem 0 .6rem}
.hstats{display:flex;gap:.8rem;font-family:"Press Start 2P",monospace;font-size:.7rem;line-height:1.6;flex-wrap:wrap}
.hstage{position:relative;border:4px solid var(--ink);box-shadow:.4rem .4rem 0 rgba(0,0,0,.2);max-width:calc(60vh * 16 / 9);margin:0 auto;background:#000}
#hc{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}
.hmsg{position:absolute;left:50%;top:.6rem;transform:translateX(-50%);background:#fff;color:#1d120a;border:3px solid #1d120a;padding:.3rem .7rem;font-family:"Press Start 2P",monospace;font-size:clamp(.5rem,1.6vw,.8rem);line-height:1.6;max-width:92%;width:max-content;text-align:center;pointer-events:none}
.hmsg.alert{background:#c2410c;color:#fff}
.hctrl{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem;gap:1rem}
.hctrl .stick{position:relative;width:8rem;height:8rem;border-radius:50%;background:rgba(58,36,20,.12);border:3px solid rgba(58,36,20,.4);touch-action:none;visibility:hidden;flex:none}
@media (pointer:coarse){.hctrl .stick{visibility:visible}}
.hctrl .stick i{position:absolute;left:50%;top:50%;width:3.4rem;height:3.4rem;margin:-1.7rem;border-radius:50%;background:var(--ink);opacity:.8}
.fartBtn{width:5.6rem;height:5.6rem;border-radius:50%;background:#7aa83a;color:#14210a;font-family:"Press Start 2P",monospace;font-size:.8rem;box-shadow:0 .35rem 0 #4f7a20;touch-action:none;margin-left:auto;flex:none}
.fartBtn:active{transform:translateY(.25rem);box-shadow:0 .1rem 0 #4f7a20}
.hacts{display:flex;gap:.9rem;align-items:flex-start;margin-left:auto}
/* Game Boy style (Randi, 20 Nov: "an action and interact"): two round buttons
   on a diagonal, Use (B) low on the left, Fart (A) high on the right. Each says
   what it does; Use reads Open or Close next to a door or the fridge. */
.useBtn{width:5.6rem;height:5.6rem;border-radius:50%;background:#a3244a;color:#fff;font-family:"Press Start 2P",monospace;font-size:.65rem;box-shadow:0 .35rem 0 #6e1631;touch-action:none;margin-top:2.6rem}
.useBtn:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .1rem 0 #6e1631}
.useBtn:disabled{opacity:.45}
/* While you're in the house it fills the screen, with the bar, buttons and
   messages floating over it, like Mission Directive (Randi's ask, 20 Nov: no
   wasted space on a phone). */
body.housePlay{overflow:hidden;touch-action:none;overscroll-behavior:none}
body.housePlay .bar{position:fixed;top:0;left:0;right:0;z-index:9;padding-top:max(.6rem,env(safe-area-inset-top))}
@media (max-width:30rem){body.housePlay .bar{flex-wrap:nowrap;gap:.4rem}body.housePlay .bar .pill{font-size:.5rem;padding:.3rem .4rem}body.housePlay .hstats{font-size:.5rem;gap:.6rem}}
body.housePlay main{max-width:none;padding:0}
body.housePlay #house{position:fixed;inset:0;z-index:5;background:#2a1a10;overflow:hidden}
body.housePlay .hstage{position:absolute;inset:0;border:0;box-shadow:none;max-width:none;margin:0;background:#2a1a10}
body.housePlay #hc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:auto}
body.housePlay .hhud{position:fixed;z-index:8;top:calc(3.6rem + env(safe-area-inset-top));left:max(.75rem,env(safe-area-inset-left));right:max(.75rem,env(safe-area-inset-right));margin:0;background:rgba(255,250,240,.9);border:3px solid var(--ink);padding:.35rem .6rem;gap:.3rem 1rem}
body.housePlay .hhud .meterbox label{font-size:.85rem;margin-bottom:.15rem}
body.housePlay .hhud .meter{height:1.1rem}
body.housePlay .hmsg{position:fixed;top:calc(8.4rem + env(safe-area-inset-top));z-index:8}
body.housePlay .hctrl{position:fixed;z-index:8;left:0;right:0;bottom:0;margin:0;padding:1rem max(1rem,env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));pointer-events:none}
body.housePlay .hctrl>*{pointer-events:auto}
body.housePlay .hctrl .stick{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.55)}
body.housePlay .hctrl .stick i{background:#f4f1e4}
/* how to play stays behind the ? button (Randi, 20 Nov: no instructions left up) */
.goalList{list-style:none;margin:.5rem 0 0;padding:0}
.goalList li{display:flex;gap:.5rem;align-items:center;padding:.15rem 0}
.goalList .box{width:.9rem;height:.9rem;border:2px solid var(--ink);flex:none}
.goalList .done .box{background:var(--ink)}
.goalList .done{color:var(--soft);text-decoration:line-through}
#goalsBtn{display:none}
body.housePlay #goalsBtn{display:inline-block}
.helpBox{position:fixed;z-index:12;top:calc(3.6rem + env(safe-area-inset-top));right:max(.75rem,env(safe-area-inset-right));max-width:min(24rem,calc(100vw - 1.5rem));background:var(--panel);border:3px solid var(--ink);padding:.7rem .9rem;box-shadow:.3rem .3rem 0 rgba(0,0,0,.3);line-height:1.45}
.hdList{list-style:none;padding:0;margin:.6rem 0;display:flex;flex-wrap:wrap;gap:.4rem}
.hdList img{width:2.5rem;height:2.5rem;image-rendering:pixelated;display:block}
.cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,24,12,.6);z-index:20;padding:1rem;overflow:auto}
.card{background:var(--panel);border:4px solid var(--ink);padding:1.25rem;max-width:30rem;width:100%;box-shadow:.4rem .4rem 0 rgba(0,0,0,.3)}
.card h2{margin:0 0 .6rem;font-family:"Press Start 2P",monospace;font-size:1.2rem;line-height:1.6;text-align:center}
.card p{margin:.4rem 0}
.row{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
.btn{background:var(--accent);color:#fff;padding:.8rem 1.1rem;font-family:"Press Start 2P",monospace;font-size:.7rem;line-height:1.6;box-shadow:.25rem .25rem 0 var(--line)}
.btn.plain{background:var(--panel);color:var(--ink);border:2px solid var(--ink)}
.coll{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:30rem){.coll{grid-template-columns:1fr}}
.coll li{border:2px solid var(--line);border-radius:.6rem;padding:.5rem;display:flex;gap:.6rem;align-items:center}
.coll svg{width:3.2rem;height:2.4rem;flex:none}
.coll b{display:block}
.coll .d{font-size:.85rem;color:var(--soft);display:block}
.coll button{font-size:.8rem;text-decoration:underline;padding:.2rem 0;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#1d120a;color:#fff;padding:.6rem 1rem;border-radius:.6rem;font-weight:600;z-index:15;text-align:center;max-width:calc(100vw - 2rem)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- the scene. Faces and poses are swapped with data attributes on the svg. ---- */
.face,#armOut{display:none}
svg[data-face="normal"] .f-normal,svg[data-face="eat"] .f-eat,svg[data-face="smug"] .f-smug,svg[data-face="frozen"] .f-frozen{display:inline}
svg.finger #armOut{display:inline}
svg.finger #armDown{display:none}
#armOut{cursor:pointer}
#tip{animation:tip 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tip{50%{transform:scale(1.5);opacity:.3}}
#belly{transform-box:fill-box;transform-origin:center bottom;transform:scaleX(var(--b,1));transition:transform .4s}
#him{transition:transform 1.6s ease-in,opacity .3s}
#him.run{transform:translateX(-120px);opacity:0;transition:transform 1.1s ease-in,opacity .3s 1s}
#him.run #legs{animation:legs .18s linear infinite}
@keyframes legs{50%{transform:translateY(-6px)}}
#doorOpen{display:none}
svg.dooropen #doorOpen{display:inline}
.stem{transform-box:view-box;transition:transform 1.5s,filter 1.5s}
#stemL{transform-origin:560px 228px}#stemM{transform-origin:560px 228px}#stemR{transform-origin:560px 228px}
svg.wilt #stemL{transform:rotate(-100deg);filter:saturate(.2) brightness(.7)}
svg.wilt #stemM{transform:rotate(115deg);filter:saturate(.2) brightness(.7)}
svg.wilt #stemR{transform:rotate(100deg);filter:saturate(.2) brightness(.7)}
#dogPaw{transition:transform .4s}
svg.dognose #dogPaw{transform:translate(18px,-58px) rotate(-20deg)}
#dogEyes2{display:none}
svg.dognose #dogEyes2{display:inline}svg.dognose #dogEyes{display:none}
#cat{transition:transform .5s ease-in,opacity .5s}
svg.catgone #cat{transform:translateX(220px);opacity:0}
.noseHand,.fanHand{display:none}
svg.noses .noseHand{display:inline}
svg.noses .fanHand{display:inline;animation:fan .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left bottom}
@keyframes fan{to{transform:rotate(-35deg)}}
svg.noses .pmouth{display:none}
.pmouthEw{display:none}
svg.noses .pmouthEw{display:inline}
#scene image{image-rendering:pixelated}
.fall{animation:fall 7s linear infinite;transform-box:view-box}
.fall.f1{animation-delay:-2.5s;animation-duration:8s}.fall.f2{animation-delay:-5s;animation-duration:6.5s}
@keyframes fall{0%{transform:translate(0,-10px)}25%{transform:translate(10px,25px)}50%{transform:translate(-4px,55px)}75%{transform:translate(8px,85px)}100%{transform:translate(0,115px)}}
#flyWing{animation:buzz .08s linear infinite alternate}
@keyframes buzz{to{opacity:.2}}
#flyLoop{animation:loop 3s linear infinite;transform-box:view-box;transform-origin:470px 195px}
@keyframes loop{to{transform:rotate(360deg)}}
#fly{transition:transform .8s ease-in}
svg.flydrop #fly{transform:translate(0,52px)}
svg.flydrop #flyLoop{animation:none}
svg.flydrop #flyWing{animation:none}
svg.slow{filter:saturate(.5) contrast(1.15)}
.steam path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;animation:steam 2.4s ease-in infinite;transform-box:view-box}
.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
#fish{animation:swim 4s ease-in-out infinite alternate;transform-box:view-box}
@keyframes swim{to{transform:translateX(26px)}}
#fishHide{transition:transform .5s,opacity .5s;transform-box:fill-box;transform-origin:center}
svg.noses #fishHide{transform:translate(-14px,-6px) scale(.6);opacity:.55}
#hangLeaves{transition:transform 1.5s,filter 1.5s;transform-box:fill-box;transform-origin:center top}
svg.wilt #hangLeaves{transform:scaleY(1.2) scaleX(.8);filter:saturate(.15) brightness(.75)}
#cactus{transition:transform .6s ease-in;transform-box:view-box;transform-origin:756px 148px}
svg.wilt #cactus{transform:rotate(85deg)}
@media (prefers-reduced-motion:reduce){.pull.ready,#tip,#flyLoop,#flyWing,svg.noses .fanHand,.steam path,#fish,.fall{animation:none}}
</style>
</head>
<body>
<script src="../shared/no-menu.js"></script>
<script src="../shared/menu.js"></script>
<div class="bar">
  <a class="pill" href="../">← All games</a>
  <span class="grow"></span>
  <button class="pill" id="goalsBtn" aria-expanded="false" aria-controls="helpBox"></button>
  <button class="pill" id="helpBtn" aria-expanded="false" aria-controls="helpBox" aria-label="How to play">?</button>
  <button class="pill" id="collBtn" aria-haspopup="dialog">Farts 0/8</button>
  <button class="pill" id="soundBtn">Sound on</button>
</div>
<main>
  <h1 class="sr">Feed the Fart</h1>
  <section id="house" hidden aria-label="The house">
    <div class="hhud">
      <div class="meterbox">
        <label for="hMeter"><span id="hBarLabel"></span><span id="hWord"></span></label>
        <div class="meter" id="hMeter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="hFill"></i></div>
      </div>
      <div class="hstats"><span id="hRoom"></span><span id="hScore"></span><span id="hFood"></span></div>
    </div>
    <div class="hstage"><canvas id="hc" width="256" height="144" role="img"></canvas><div class="hmsg" id="hMsg" hidden></div></div>
    <div class="hctrl"><div class="stick" id="hStick" aria-hidden="true"><i></i></div><div class="hacts"><button class="useBtn" id="hUse" disabled></button><button class="fartBtn" id="hFart"></button></div></div>
  </section>
  <div id="dinner">
  <p class="hint" id="fromHouse" hidden></p>
  <div class="top">
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 800 460" role="img" aria-label="Thanksgiving dinner. The plumber stands by the table, with the family, a dog under the table and a cat on the windowsill." data-face="normal">
      <defs>
        <!-- Dithers line up with the game's pixels: one canvas pixel is 800/256 = 3.125 SVG units. -->
        <pattern id="dLight" width="6.25" height="6.25" patternUnits="userSpaceOnUse"><rect width="3.125" height="3.125" fill="#fbecc9"/><rect x="3.125" y="3.125" width="3.125" height="3.125" fill="#fbecc9"/></pattern>
        <pattern id="dShade" width="6.25" height="6.25" patternUnits="userSpaceOnUse"><rect width="3.125" height="3.125" fill="#6e4528"/><rect x="3.125" y="3.125" width="3.125" height="3.125" fill="#6e4528"/></pattern>
        <clipPath id="winClip"><rect x="608" y="36" width="144" height="106"/></clipPath>
      </defs>
      <!-- room -->
      <rect width="800" height="330" fill="#f1d7a6"/>
      <!-- the lamp over the table and its glow on the wall -->
      <ellipse cx="470" cy="110" rx="200" ry="125" fill="url(#dLight)"/>
      <ellipse cx="470" cy="100" rx="135" ry="85" fill="#f8e3b8"/>
      <ellipse cx="470" cy="90" rx="80" ry="50" fill="url(#dLight)"/>
      <rect x="0" y="0" width="800" height="12" fill="#7a4a2a"/>
      <!-- fish tank on a wall shelf -->
      <rect x="112" y="102" width="100" height="6" fill="#5a3418"/>
      <rect x="120" y="58" width="84" height="44" fill="#3a2414"/><rect x="123" y="61" width="78" height="38" fill="#8fd3f5"/>
      <rect x="123" y="92" width="78" height="7" fill="#c9a26a"/><path d="M132 92q-4-14 2-24M140 92q4-12-2-20" stroke="#3f8f3a" stroke-width="3" fill="none"/>
      <g id="fishHide"><g id="fish"><ellipse cx="160" cy="78" rx="9" ry="6" fill="#f08a1e"/><path d="M151 78l-7-5v10z" fill="#d96a10"/><circle cx="164" cy="76" r="1.5" fill="#2a1a0e"/></g></g>
      <!-- a hanging plant -->
      <path d="M548 12v26" stroke="#3a2414" stroke-width="2"/>
      <path d="M537 38h22l-3 14h-16z" fill="#c2643a"/>
      <g id="hangLeaves">
        <path d="M540 50q-8 20-4 44M548 52q0 22 2 40M556 50q8 18 4 38" stroke="#3f8f3a" stroke-width="3" fill="none"/>
        <path transform="translate(538 62) rotate(160)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#4f9a3a"/><path transform="translate(538 62) rotate(160)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/><path transform="translate(536 78) rotate(200)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#3f7d2a"/><path transform="translate(536 78) rotate(200)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/><path transform="translate(537 92) rotate(150)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#4f9a3a"/><path transform="translate(537 92) rotate(150)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/><path transform="translate(551 68) rotate(20)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#3f7d2a"/><path transform="translate(551 68) rotate(20)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/><path transform="translate(551 86) rotate(160)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#4f9a3a"/><path transform="translate(551 86) rotate(160)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/><path transform="translate(560 60) rotate(30)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#4f9a3a"/><path transform="translate(560 60) rotate(30)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/><path transform="translate(562 76) rotate(-20)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#3f7d2a"/><path transform="translate(562 76) rotate(-20)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/><path transform="translate(561 90) rotate(40)" d="M0 0q6 -4.0 12 0q-6 4.0 -12 0z" fill="#4f9a3a"/><path transform="translate(561 90) rotate(40)" d="M1 0h8.4" stroke="#8fd06a" stroke-width="1.6"/>
      </g>

let ac, master, noiseBuf;
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .8; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return soundOn ? ac : null;
}

// ---------- the clouds ----------
const NS = 'http://www.w3.org/2000/svg';
function cloud(type, scale, slow, x0, y0) {
  const ty = TYPES[type], g = document.createElementNS(NS, 'g');
  for (let i = 0; i < 8; i++) {
    const c = document.createElementNS(NS, 'circle');
    const a = i / 8 * Math.PI * 2;
    c.setAttribute('cx', (Math.cos(a) * 26 * (.6 + Math.random() * .5)).toFixed(1));
    c.setAttribute('cy', (Math.sin(a) * 16 * (.6 + Math.random() * .5)).toFixed(1));
    c.setAttribute('r', (22 + Math.random() * 14).toFixed(1));
    c.setAttribute('fill', ty.color);
    g.append(c);
  }
  $('#clouds').append(g);
  const sx = x0 == null ? 108 : x0, sy = y0 == null ? 322 : y0;
  const dur = (2600 + scale * 1800) * (slow || 1), t0 = performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 2);
    const s = .25 + e * scale * 2.4;
    const x = sx + (reduce ? 0 : e * 260 * scale), y = sy - (reduce ? 0 : e * 90);
    g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`);
    g.setAttribute('opacity', (ty.alpha * (p < .6 ? 1 : 1 - (p - .6) / .4)).toFixed(3));
    if (p < 1) requestAnimationFrame(step); else g.remove();
  })(t0);
}

// ---------- the room ----------
function react(level) {
  clearTimeout(clearT);
  if (level >= 1) svg.classList.add('dognose');
  // Decided 20 Nov: the kids at the table yell his name on the bad ones; always
  // on the biggest, about half the time on medium ones.
  if (level >= 2) { svg.classList.add('noses', 'flydrop'); sayRoom(level >= 3 || Math.random() < .5 ? T.yell : pick(T.roomEw)); }
  if (level >= 3) svg.classList.add('wilt', 'catgone');
  clearT = setTimeout(calm, 7000);
}
function calm() { svg.classList.remove('dognose', 'noses', 'flydrop', 'wilt', 'catgone'); $('#sayRoom').hidden = true; }

let sayT = {};
function bubble(id, text, ms) {
  const el = $(id); el.textContent = text; el.hidden = false;
  clearTimeout(sayT[id]); if (ms) sayT[id] = setTimeout(() => el.hidden = true, ms);
}
const say = (t, ms = 2600) => bubble('#sayHim', t, ms);
const sayRoom = t => bubble('#sayRoom', t, 4000);
let faceT;
function face(f, ms) { svg.dataset.face = f; clearTimeout(faceT); if (ms) faceT = setTimeout(() => svg.dataset.face = 'normal', ms); }

// ---------- eating, the meter, the finger ----------
function eat(f) {
  if (busy || belly.gas >= 100) return;
  audio(); nom();
  belly.gas = Math.min(100, belly.gas + f.gas); belly.total += f.gas;
  for (const k in f.mix) belly[k] += f.mix[k] * f.gas;
  belly.ate.add(f.id);
  face('eat', 500);
  if (f.room) sayRoom(f.room);
  if (belly.gas >= 100) say(T.full, 0);
  else if (f.say) say(f.say);
  // his go-to hot sauce (decided 20 Nov), now and then on savory food
  else if ((f.mix.savory || 0) + (f.mix.sulfur || 0) >= .5 && Math.random() < .35) say(pick(T.tapatio));
  else if ((f.mix.dairy || 0) >= .5) say(pick(T.dairyEat));
  else if (belly.gas >= READY && !svg.classList.contains('finger')) say(T.ready);
  else say(fill(T.mmm, { food: f.name.toLowerCase() }), 1500);
  update();
}
function update() {
  const g = belly.gas;
  $('#meterFill').style.width = g + '%';
  $('#meter').setAttribute('aria-valuenow', g);
  const w = g >= 100 ? 3 : g >= 50 ? 2 : g > 0 ? 1 : 0;
  $('#meterWord').textContent = T.meterWords[w];
  $('#meter').setAttribute('aria-valuetext', `${g}%, ${T.meterWords[w]}`);
  const ready = g >= READY && !busy;
  svg.classList.toggle('finger', ready);
  $('#pullBtn').disabled = !ready;
  $('#pullBtn').classList.toggle('ready', ready && g >= 100);
  for (const { f, b } of foodBtns) { drawFood(f, b); b.disabled = locked(f) || busy || g >= 100; }
  $('#hint').textContent = busy ? T.hintBusy : g >= 100 ? T.hintFull : g >= READY ? T.hintReady : T.hintEmpty;
  svg.style.setProperty('--b', (1 + g * .0018).toFixed(3));
  $('#collBtn').textContent = fill(T.count, { n: found.size, total: ORDER.length });
}

function pull() {
  if (busy || belly.gas < READY) return;
  audio();
  busy = true;
  const type = whichFart(), ty = TYPES[type], full = belly.gas / 100;
  const dairy = belly.dairy / Math.max(1, belly.total) >= .3;
  const scale = ty.size * (.55 + full * .6);
  $('#sayHim').hidden = true;
  update();
  if (type === 'shart') return shart();
  if (type === 'machine') { for (let i = 0; i < 6; i++) setTimeout(() => cloud(type, scale), i * 110); }
  else cloud(type, scale);
  playType(type, .55 + full * .45);
  const level = Math.max(ty.react, full >= .99 ? 2 : full >= .7 ? 1 : 0);
  const delay = type === 'sbd' ? 2600 : 600;
  face(type === 'sneaky' || type === 'sbd' ? 'smug' : 'normal');
  setTimeout(() => {
    react(type === 'sneaky' ? 1 : level);
    if (type === 'sbd') { sayRoom(T.roomSbd); setTimeout(() => sayRoom(T.yell), 1600); }
    $('#live').textContent = fill(T.live, { name: ty.name, react: T.liveReact[type === 'sneaky' ? 1 : level] });
  }, delay);
  setTimeout(() => {
    say(dairy ? T.cheese : type === 'sneaky' ? T.sneaky : type === 'sbd' ? T.sbd : pick(T.after), 3000);
    discover(type);
  }, delay + 500);
  setTimeout(() => { emptyBelly(); busy = false; face('normal'); update(); }, delay + 2400);
}

function discover(type) {
  if (found.has(type)) return;
  found.add(type); store.set(KEY, JSON.stringify([...found]));
  const snack = FOODS.find(f => f.unlock === found.size);
  toast(fill(T.newFind, { name: TYPES[type].name }) + (snack ? ' ' + fill(T.newSnack, { name: snack.name }) : ''));
  update();
}
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3000); }

// The secret win. Decided 20 Nov: keep it cartoony, never the mess. His face
// freezes, a slow pause, "Oh no.", then he runs off to the bathroom (added
// 20 Nov), the door slams, and "I might need a change of clothes." comes from
// behind it (it replaced the card's "I need to go home." the same day).
function shart() {
  const a = audio(); if (a) SOUNDS.shart(a.currentTime + .02);
  cloud('shart', 1.6, 2.2);
  face('frozen');
  svg.classList.add('slow');
  react(3);
  $('#live').textContent = TYPES.shart.name + '!';
  setTimeout(() => say(T.ohNo, 0), 1600);
  setTimeout(() => { $('#sayHim').hidden = true; svg.classList.add('dooropen'); $('#him').classList.add('run'); }, 3400);
  setTimeout(() => { svg.classList.remove('dooropen'); slam(); }, 4700);
  setTimeout(() => { bubble('#sayDoor', T.goHome, 0); const a2 = audio(); if (a2) sadTrombone(a2.currentTime + .05); $('#live').textContent = T.goHome; }, 5600);
  setTimeout(() => {
    discover('shart');
    $('#winText').textContent = T.winText;
    $('#winCover').hidden = false; $('#winAgain').focus();
  }, 8200);
}
function playAgain() {
  $('#winCover').hidden = true; $('#sayDoor').hidden = true;
  svg.classList.remove('slow'); $('#him').classList.remove('run');
  calm(); face('normal'); emptyBelly(); busy = false; update();
  $('#pullBtn').focus();
}

// ---------- 16-bit look (decided 20 Nov, Randi: "can we go 8bit? or really 16 bit?") ----------
// The scene is still drawn as one SVG, so the poses, reactions and clouds stay
// simple CSS and DOM. A copy of it, with each element's live (mid-animation)
// style written onto it, is drawn into a canvas at 4x the pixel size, then
// one sample from the middle of each 4x4 block is kept. Taking one sample
// rather than averaging the block is what gives hard pixel edges; averaging
// (just drawing it small) left blurry blended edges that read as a shrunk
// picture, not pixel art. The SVG stays underneath for clicks and screen
// readers, and shows on its own if this ever fails.
(() => {
  const W = 256, H = Math.round(W * 460 / 800), K = 4;
  const out = $('#px'), o = out.getContext('2d');
  out.width = W; out.height = H;
  const big = document.createElement('canvas'); big.width = W * K; big.height = H * K;
  const b = big.getContext('2d', { willReadFrequently: true });
  const frame = o.createImageData(W, H);
  const els = [svg, ...svg.querySelectorAll('*')];
  const PROPS = ['display', 'opacity', 'transform', 'transform-origin', 'transform-box', 'filter', 'image-rendering'];
  let loading = false;
  // Pixel-art outlines (decided 20 Nov, from Randi's Stardew-style references):
  // where two colours meet with a big jump in brightness, the darker side gets
  // a one-pixel edge in a dark shade of its own colour, not flat black. The
  // jump has to be big so the wall's light dither and soft shading don't get
  // outlined too.
  const lum = new Float32Array(W * H), JUMP = 34;
  function outline(d) {
    for (let i = 0; i < W * H; i++) lum[i] = d[i * 4] * .3 + d[i * 4 + 1] * .59 + d[i * 4 + 2] * .11;
    const mark = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      for (const j of [x + 1 < W ? i + 1 : -1, y + 1 < H ? i + W : -1]) {
        if (j < 0 || Math.abs(lum[i] - lum[j]) < JUMP) continue;
        mark[lum[i] < lum[j] ? i : j] = 1;
      }
    }
    for (let i = 0; i < W * H; i++) if (mark[i]) { const t = i * 4; d[t] *= .42; d[t + 1] *= .38; d[t + 2] *= .36; }
  }
  function snap() {
    if (loading) return;
    loading = true;
    const copy = svg.cloneNode(true), all = [copy, ...copy.querySelectorAll('*')];
    const live = [svg, ...svg.querySelectorAll('*')];   // clouds come and go, so walk it fresh
    for (let i = 0; i < live.length; i++) {
      const cs = getComputedStyle(live[i]);
      all[i].setAttribute('style', PROPS.map(p => `${p}:${cs.getPropertyValue(p)}`).join(';'));
    }
    copy.setAttribute('width', W * K); copy.setAttribute('height', H * K);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)], { type: 'image/svg+xml' }));
    const img = new Image();
    img.onload = () => {
      b.drawImage(img, 0, 0, W * K, H * K);
      const src = b.getImageData(0, 0, W * K, H * K).data, d = frame.data, h = K >> 1;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const s = ((y * K + h) * W * K + x * K + h) * 4, t = (y * W + x) * 4;

    };

    img.src = url;

})();

    cx.globalAlpha = 1;
    cx.font = '8px "Press Start 2P", monospace'; cx.textAlign = 'center';
    for (const p of G.pops) { cx.fillStyle = '#2a1a0e'; cx.fillText(p.text, Math.round(p.x - c.x) + 1, Math.round(p.y - c.y - p.t * 10) + 1); cx.fillStyle = '#ffe066'; cx.fillText(p.text, Math.round(p.x - c.x), Math.round(p.y - c.y - p.t * 10)); }
    cx.textAlign = 'start';
  }
  function frame(t) {
    if (mode !== 'house') return;
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    try { step(dt); if (mode === 'house') draw(); } catch (e) { console.error(e); }   // one bad frame mustn't stop the loop
    if (mode === 'house') raf = requestAnimationFrame(frame);
  }

  // ---- controls ----
  document.addEventListener('keydown', e => {
    if (mode !== 'house' || document.querySelector('dialog[open]')) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(k)) { keys[k] = true; e.preventDefault(); }
    else if ((k === ' ' || k === 'f') && !e.repeat) { e.preventDefault(); fart(); }
    else if ((k === 'e' || k === 'Enter') && !e.repeat && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); use(); }
    else if (k === 'c') showColl();
  });
  document.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
  window.addEventListener('blur', () => { keys = {}; stick = { x: 0, y: 0 }; hold = null; });
  const st = $('#hStick'), knob = st.querySelector('i');
  function stickAt(e) {
    const r = st.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2, max = r.width / 2, d = Math.hypot(x, y);
    const k = d > max ? max / d : 1; stick = { x: x * k / max, y: y * k / max }; if (Math.hypot(stick.x, stick.y) < .2) stick = { x: 0, y: 0 };
    knob.style.transform = `translate(${x * k}px, ${y * k}px)`;
  }
  st.addEventListener('pointerdown', e => { st.setPointerCapture(e.pointerId); stickAt(e); e.preventDefault(); });
  st.addEventListener('pointermove', e => { if (st.hasPointerCapture(e.pointerId)) stickAt(e); });
  const stickOff = () => { stick = { x: 0, y: 0 }; knob.style.transform = ''; };
  st.addEventListener('pointerup', stickOff); st.addEventListener('pointercancel', stickOff);
  cv.dataset.hold = '';
  const holdAt = e => { const r = cv.getBoundingClientRect(); hold = { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); holdAt(e); });
  cv.addEventListener('pointermove', e => { if (cv.hasPointerCapture(e.pointerId)) holdAt(e); });
  cv.addEventListener('pointerup', () => hold = null); cv.addEventListener('pointercancel', () => hold = null);
  for (const [id, fn] of [['#hFart', fart], ['#hUse', use]]) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
    b.addEventListener('click', e => { if (e.detail === 0) fn(); });   // Enter or Space on the focused button
  }
  const leave = () => document.body.classList.remove('housePlay');
  function goalsHTML() {
    const esc = x => x.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
    return `<b>${esc(fill(T.goalsHead, { n: G ? G.goals.size : 0, all: GOALS.length }))}</b><ul class="goalList">` +
      GOALS.map(id => { const d = G && G.goals.has(id); return `<li class="${d ? 'done' : ''}"><span class="box" aria-hidden="true"></span>${esc(T.goals[id])}<span class="sr">${d ? ' (done)' : ''}</span></li>`; }).join('') + '</ul>';
  }
  return { goalsHTML, peek: () => G, gas, start,   // peek: for checking the level from the console
    again: () => { $('#houseDone').hidden = true; start(); },
    dinner: () => { $('#houseDone').hidden = true; leave(); startDinner(new Set(G.got)); window.scrollTo(0, 0); } };
})();

$('#startText').textContent = T.start;
$('#startKeys').textContent = T.keys;
$('#startBtn').textContent = T.playHouse; $('#dinnerBtn').textContent = T.justDinner;
$('#hBarLabel').textContent = T.barLabel; $('#hFart').textContent = T.fart; $('#hUse').textContent = T.use;
// One box under the bar for How to play (?) and, in the house, the Goals list.
function toggleHelp(show, kind = 'help') {
  const box = $('#helpBox');
  if (show === undefined) show = box.hidden || box.dataset.kind !== kind;
  box.dataset.kind = kind;
  if (kind === 'goals') box.innerHTML = HOUSE.goalsHTML(); else box.textContent = mode === 'house' ? T.houseHint : T.keys;
  box.hidden = !show;
  $('#helpBtn').setAttribute('aria-expanded', String(show && kind === 'help')); $('#goalsBtn').setAttribute('aria-expanded', String(show && kind === 'goals'));
}
$('#helpBtn').onclick = () => toggleHelp();
$('#goalsBtn').onclick = () => toggleHelp(undefined, 'goals');
$('#goalsBtn').textContent = T.goalsBtn;
document.addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H') && $('#startCover').hidden && !document.querySelector('dialog[open]')) toggleHelp(); });
document.addEventListener('pointerdown', e => { if (!$('#helpBox').hidden && !e.target.closest('#helpBox, #helpBtn, #goalsBtn')) toggleHelp(false); });
$('#hMeter').setAttribute('aria-label', T.barLabel);
$('#hdAgain').textContent = T.again; $('#hdDinner').textContent = T.toDinner;
$('#startBtn').onclick = () => { audio(); $('#startCover').hidden = true; HOUSE.start(); };
$('#hdAgain').onclick = HOUSE.again;
$('#hdDinner').onclick = HOUSE.dinner;
</script>
</body>
