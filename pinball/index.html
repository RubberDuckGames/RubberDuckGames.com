<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinball · Rubber Duck Games</title>
<meta name="description" content="Pixel pinball tables: The Mighty Pepper's ranch and Zombies of Tomorrow. Ride the ramp, find the lost things under the house, and knock down the targets to reach the secret holes.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="game.css">
<script src="../shared/no-menu.js"></script>
<script src="../shared/menu.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/files.js"></script>
</head>
<body>
<h1 class="sr">Pinball</h1>
<div class="bar" id="bar">
  <a class="pill" href="../">← All games</a>
  <span class="grow"></span>
  <button class="pill" id="whoBtn" type="button" hidden></button>
  <button class="pill" id="soundBtn" type="button"></button>
</div>
<main class="wrap" id="wrap">
  <canvas id="box" aria-hidden="true"></canvas>
  <canvas id="cv" data-hold role="img"></canvas>
</main>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<div class="cover" id="cover"><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div></div>

<script src="game.js"></script>
<script src="table-pepper.js"></script>
<script src="table-zombies.js"></script>
</body>
</html>
