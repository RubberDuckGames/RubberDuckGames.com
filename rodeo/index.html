<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodeo · Rubber Duck Games</title>
<meta name="description" content="A small test of rodeo racing: one horse, barrels, poles and roping, against the clock.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--soft:#7a6450;--bg:#f3e3c3;--panel:#fffdf7;--line:#d8c096;--accent:#c0392b;font-family:Lexend,Verdana,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;touch-action:manipulation}
body{font-size:1.125rem;line-height:1.45;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;pointer-events:none}
.bar>*{pointer-events:auto}
.bar .grow{flex:1}
.pill{background:var(--panel);border:2px solid var(--line);padding:.375rem .875rem;white-space:nowrap;text-decoration:none;color:inherit;font-family:"Press Start 2P",monospace;font-size:.7rem;line-height:1.6;box-shadow:.25rem .25rem 0 var(--line)}
/* 100dvh, because 100vh on iPhone Safari counts the space under its toolbar, so
   a sideways arena centered in it sat too low and lost its bottom edge (31 Oct) */
.wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center}
.stagebox{position:relative}
canvas{display:block;width:100%;margin:0 auto;image-rendering:pixelated;background:#d9b67a;touch-action:none}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(60,40,20,.45);z-index:9;padding:1rem}
.card{background:var(--panel);border:4px solid var(--ink);padding:1.25rem;max-width:26rem;width:100%;text-align:center;box-shadow:.4rem .4rem 0 rgba(0,0,0,.25)}
.card h2{margin:0 0 .5rem;font-family:"Press Start 2P",monospace;font-size:1.4rem;line-height:1.5}
.card p{margin:.3rem 0;color:var(--soft)}
.row{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.9rem}
.btn{background:var(--accent);color:#fff;padding:.8rem 1.1rem;font-family:"Press Start 2P",monospace;font-size:.75rem;line-height:1.6;box-shadow:.25rem .25rem 0 var(--line)}
/* touch: the stick on the left, a big Go on the right, only on touch screens */
.ctrl{display:none;position:fixed;left:0;right:0;bottom:0;z-index:7;justify-content:space-between;align-items:center;padding:1.2rem;pointer-events:none}
@media (pointer:coarse){.ctrl{display:flex}}
.ctrl>*{pointer-events:auto}
.stick{position:relative;width:8rem;height:8rem;border-radius:50%;background:rgba(59,42,26,.15);border:3px solid rgba(59,42,26,.4);touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:3.5rem;height:3.5rem;margin:-1.75rem;border-radius:50%;background:var(--ink);opacity:.8}
.go{width:7rem;height:7rem;border-radius:50%;background:var(--accent);color:#fff;font-family:"Press Start 2P",monospace;font-size:1rem;box-shadow:0 .35rem 0 #7f241a;touch-action:none}
.go:active{transform:translateY(.25rem);box-shadow:0 .1rem 0 #7f241a}
/* Decided 31 Oct: phone first, the same two ways Bread plays. Held upright it's
   a Game Boy: the arena in a dark screen frame, the stick and a round red GO
   below it, and the results cover the whole screen because the arena is short.
   Turned sideways it goes as full screen as a phone allows: the arena is as
   tall as the screen, the sides are the same dirt, and the stick and GO sit on
   them where the thumbs are. */
@media (pointer:coarse) and (orientation:portrait){
  html,body{background:#c9c4b8}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .bar{position:static}
  .pill{background:#e2ddd2;border-color:#a8a294;box-shadow:.2rem .2rem 0 #a8a294}
  .wrap{display:block;min-height:0;padding:0 .75rem}
  .stagebox{background:#4a4a58;padding:.9rem .9rem 1.6rem;border-radius:.6rem .6rem 2.4rem .6rem;box-shadow:inset 0 0 0 3px #3a3a46}
  .stagebox::after{content:"RODEO";position:absolute;left:1rem;bottom:.35rem;font-family:"Press Start 2P",monospace;font-size:.5rem;color:#b9b9c9;letter-spacing:.1em}
  canvas{border:3px solid #2a2a33}
  .cover{position:fixed;overflow:auto}
  .ctrl{position:static;flex:1;padding:1rem 1.5rem calc(1rem + env(safe-area-inset-bottom))}
  .stick{width:8.5rem;height:8.5rem;background:#b3ae9f;border-color:#a8a294}
  .stick i{background:#2a2a33;opacity:1}
  .go{width:6.5rem;height:6.5rem;background:#a3244a;box-shadow:0 .35rem 0 #6e1631}
  .go:active{box-shadow:0 .1rem 0 #6e1631}
}
@media (pointer:coarse) and (orientation:landscape){
  html,body{background:#d9b67a}
  html.title,html.title body{background:linear-gradient(#8fd0f0 59%,#7fb35a 59% 67%,#d9b67a 67%)}   /* the title scene runs out to the edges */
  .bar{padding:.4rem max(.5rem,env(safe-area-inset-right)) .4rem max(.5rem,env(safe-area-inset-left))}
  .pill{font-size:.5rem;padding:.3rem .5rem}
  .ctrl{top:0;padding:0 max(.6rem,env(safe-area-inset-right)) 0 max(.6rem,env(safe-area-inset-left))}
  .stick{width:6.5rem;height:6.5rem}
  .stick i{width:3rem;height:3rem;margin:-1.5rem}
  .go{width:6rem;height:6rem;opacity:.9}
}
</style>
</head>
<body>
<div class="bar">
  <a class="pill" href="../">← All games</a>
  <span class="grow"></span>
  <span class="pill" id="hBest" aria-label="Best time">Best --</span>
  <button class="pill" id="soundBtn" aria-label="Sounds on or off" title="Sounds on or off">🔔</button>
</div>
<div class="wrap">
  <div class="stagebox" id="box">
    <canvas id="cv" aria-label="The arena"></canvas>
    <div class="cover" id="cover" hidden><div class="card" id="card"></div></div>
  </div>
</div>
<div class="ctrl">
  <div class="stick" id="stick" aria-label="Steering stick"><i id="knob"></i></div>
  <button class="go" id="goBtn">GO</button>
</div>

<script>
// Rodeo Test (Trello #46). Decided 31 Oct: neighbors who barrel race say the
// games they've tried are too slow or don't play well, so this tests only how
// the horse feels: one horse, the clock, and two events. They played the
// barrels, loved it, and asked for pole bending, so that came next, then
// steer roping. Horse colors, saddles and the ride-in are still to come.
// The main rule: speed widens the turn. Come in flat out and you swing wide or
// clip the barrel; ease off, turn tight, then drive out. All in these numbers:
const TUNE = {
  max: 165,      // top speed, arena pixels a second
  tap: 30,       // speed each tap adds
  drag: 50,      // speed lost a second just by not tapping...
  dragV: .32,    // ...plus this share of the current speed
  cruise: 30,    // the slowest the horse goes once it's running
  grip: 430,     // how hard it can turn: a higher number means tighter at speed
  spin: 5.2,     // fastest it can turn at low speed, radians a second
  slip: 7,       // how quickly it stops sliding after a turn
  scrub: .55,    // speed a hard turn costs
  // Leads: a loping horse balances on the front leg that matches its turn, so
  // it changes leads when the turn flips. Steer straight for a moment between
  // turns and the change is clean; snap across and it's on the wrong lead.
  straight: .12, // seconds of going straight that make a clean change
  wrongT: .3,    // how long the wrong lead lasts, seconds
  wrong: .7,     // share of its turning it has on the wrong lead
  wrongDrag: 40, // extra speed lost a second on the wrong lead
  // Roping
  steer: 92,     // how fast the steer runs, arena pixels a second
  flee: 18,      // extra speed once the horse is close
  range: 42,     // how close the horse has to be to cast
  swing: .22,    // seconds GO has to be held before it's a swing, not a tap
  lift: 2.6,     // how hard GO lifts the dot
  fall: 1.9,     // how hard the dot falls without it
  green: .17,    // half the height of the green spot, out of the whole meter
  fill: .5,      // meter gained a second in the green
  drain: .3,     // meter lost a second out of it
  drift: .55,    // how fast the green spot moves
};
const $ = s => document.querySelector(s);
const cv = $('#cv'), out = cv.getContext('2d');
const W = 320, H = 200;
const lo = document.createElement('canvas'); lo.width = W; lo.height = H;
const cx = lo.getContext('2d');
const PIX = '"Press Start 2P", monospace';
const LINE = 165, GATE = [130, 190], FENCE = { x0: 10, x1: W - 10, y0: 8, y1: 178 };
// Pole bending: six poles in a line. Racers' poles are 21 feet apart; the gap
// here is whatever lets this horse make the weave. The gate is at the end of
// the line, as it is in a real arena, so the poles run the long way.
const POLE = { x0: 62, gap: 40, y: 93, n: 6, line: 28, gate: [63, 123] };
const EVENTS = {
  barrels: { title: 'Barrels', best: 'best', noun: 'barrel', gate: 'bottom', start: { x: 160, y: 190, hd: -Math.PI / 2 }, inside: (x, y) => y < LINE, inGate: h => h.x > GATE[0] && h.x < GATE[1], out: h => h.y > 196 },
  poles: { title: 'Poles', best: 'bestPoles', noun: 'pole', leads: true, gate: 'left', start: { x: 6, y: POLE.y, hd: 0 }, inside: x => x > POLE.line, inGate: h => h.y > POLE.gate[0] && h.y < POLE.gate[1], out: h => h.x < 1 },
  rope: { title: 'Roping', best: 'bestRope', rope: true, gate: 'none', start: { x: 22, y: POLE.y, hd: 0 }, inside: () => true, inGate: () => false, out: () => false },
};

// ---------- Saved best time (this browser only) ----------
const KEY = 'rodeo-test';
const S = Object.assign({ best: null, sound: true }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
let C = EVENTS.barrels;
function hud() { $('#hBest').textContent = `Best ${S[C.best] ? S[C.best].toFixed(2) : '--'}`; $('#soundBtn').textContent = S.sound ? '🔔' : '🔕'; }
$('#soundBtn').onclick = () => { S.sound = !S.sound; persist(); hud(); };

// ---------- Sounds ----------
let ac;
function tone(f, d, type = 'square', when = 0, vol = .04, to) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state !== 'running') ac.resume();
    const t0 = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch (e) { }
}
const sfx = {
  hoof: () => tone(110, .04, 'square', 0, .025),
  clang: () => { tone(220, .25, 'square', 0, .05, 80); tone(330, .2, 'square', .03, .03, 120); },
  ding: () => [784, 1047].forEach((f, i) => tone(f, .08, 'square', i * .06, .035)),
  bell: () => [523, 784].forEach((f, i) => tone(f, .1, 'square', i * .08, .04)),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .12, 'square', i * .1, .04)),
};

// ---------- The run ----------
let G = null;
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
function newRun(ev = C) {
  C = ev;
  // the right barrel first, turned to the right; then the left and far ones turned to the left
  G = {
    state: 'ready', t: 0, pen: 0, next: 0, dust: [], pop: null, hoof: 0, bump: 0,
    h: { ...C.start, vx: 0, vy: 0, s: 0, lead: 0, calm: 1, wrong: 0 },
    barrels: [{ x: 235, y: 112, sign: 1 }, { x: 85, y: 112, sign: -1 }, { x: 160, y: 40, sign: -1 }].map(b => ({ ...b, sum: 0, last: null, done: false, hit: false })),
    poles: Array.from({ length: POLE.n }, (_, i) => ({ x: POLE.x0 + i * POLE.gap, y: POLE.y, hit: false })),
    dir0: null,
    phase: 'chase', held: false, heldT: 0, cool: 0,
    steer: { x: 85, y: POLE.y, hd: 0, s: 0, wait: .4 }, meter: { m: 0, dot: .5, v: 0, c: .5, to: .5, wait: 0 },
  };
  $('#cover').hidden = true; hud();
}
// the gaps to ride through, in order: round the far pole, weave back up the
// line, round the first pole, weave down it, round the far pole again. -1 is
// outside the first pole and n-1 is outside the last one.
const WEAVE = (() => { const end = POLE.n - 1, s = []; for (let g = end; g >= -1; g--) s.push(g); for (let g = 0; g <= end; g++) s.push(g); return s; })();
const courseLength = () => C === EVENTS.poles ? WEAVE.length : G.barrels.length;
function showMenu() {
  G.state = 'menu'; document.documentElement.classList.remove('title');
  $('#card').innerHTML = `<h2>Rodeo</h2><div class="row">${Object.keys(EVENTS).map(k => `<button class="btn" data-ev="${k}">${EVENTS[k].title}</button>`).join('')}</div>`;
  $('#cover').hidden = false;
  $('#card').querySelectorAll('[data-ev]').forEach(b => b.onclick = () => newRun(EVENTS[b.dataset.ev]));
}
function urge() {
  if (!G || G.state === 'menu') return;
  if (G.state === 'title') return pressStart();
  if (G.state === 'done') return again();
  if (G.state === 'ready') { G.state = C.rope ? 'clock' : 'run'; sfx.bell(); }
  if (C.rope && G.phase !== 'chase') return;
  G.h.s = Math.min(TUNE.max, Math.max(G.h.s, TUNE.cruise) + TUNE.tap);
}
function wanted() {
  if (stick.on && Math.hypot(stick.x, stick.y) > .25) return Math.atan2(stick.y, stick.x);
  const x = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0), y = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
  return x || y ? Math.atan2(y, x) : null;
}
function step(dt) {
  if (!G || G.state === 'ready' || G.state === 'done' || G.state === 'menu' || G.state === 'title') { stepDust(dt); return; }
  if (C.rope && G.phase !== 'chase') return stepMeter(dt);
  const h = G.h, want = wanted();
  let turn = 0;
  h.wrong = Math.max(0, h.wrong - dt);
  if (want !== null) {
    const d = wrap(want - h.hd), way = Math.abs(d) > .12 ? Math.sign(d) : 0;
    if (!way) h.calm += dt;
    else {
      // leads are only in the poles: the barrels stay the way the racers liked them
      if (way !== h.lead) { if (C.leads && h.calm < TUNE.straight && !h.wrong) wrongLead(h); h.lead = way; }
      h.calm = 0;
    }
    const rate = Math.min(TUNE.spin, TUNE.grip / Math.max(h.s, 1)) * (h.wrong ? TUNE.wrong : 1);
    turn = Math.max(-rate * dt, Math.min(rate * dt, d));
    h.hd = wrap(h.hd + turn);
  } else h.calm += dt;
  if (h.wrong) h.s -= TUNE.wrongDrag * dt;
  h.s -= (TUNE.drag + TUNE.dragV * h.s) * dt;
  h.s -= TUNE.scrub * (Math.abs(turn) / dt / TUNE.spin) * h.s * dt;
  h.s = Math.max(TUNE.cruise, h.s);
  const k = Math.min(1, TUNE.slip * dt), vx = Math.cos(h.hd) * h.s, vy = Math.sin(h.hd) * h.s;
  const sliding = Math.hypot(vx - h.vx, vy - h.vy);
  h.vx += (vx - h.vx) * k; h.vy += (vy - h.vy) * k;
  const ox = h.x, oy = h.y;
  h.x += h.vx * dt; h.y += h.vy * dt;
  // the fence: the only gap is the gate
  G.bump -= dt;
  const inGate = C.inGate(h), leftGate = C.gate === 'left', bottomGate = C.gate === 'bottom';
  if (h.x > FENCE.x1 - 6) { h.x = FENCE.x1 - 6; h.vx *= -.3; bump(h); }
  if (h.x < FENCE.x0 + 6 && (!leftGate || (!inGate && ox >= FENCE.x0 + 6))) { h.x = FENCE.x0 + 6; h.vx *= -.3; bump(h); }
  if (h.y < FENCE.y0 + 6) { h.y = FENCE.y0 + 6; h.vy *= -.3; bump(h); }
  if (h.y > FENCE.y1 - 6 && (!bottomGate || (!inGate && oy <= FENCE.y1 - 6))) { h.y = FENCE.y1 - 6; h.vy *= -.3; bump(h); }
  // the clock runs from crossing the line going in to crossing it coming home
  const was = C.inside(ox, oy), now = C.inside(h.x, h.y), crossedIn = !was && now, crossedOut = was && !now;
  if (G.state === 'run' && crossedIn) { G.state = 'clock'; sfx.bell(); }
  if (G.state === 'clock') G.t += dt;
  if (C === EVENTS.barrels) trackBarrels(h); else if (C === EVENTS.poles) trackPoles(h, oy); else stepSteer(dt, TUNE.steer);
  if (G.state === 'clock' && crossedOut && inGate && G.next === courseLength()) return finish(true);
  if (C.out(h)) return finish(false);
  // hooves and dust
  G.hoof -= Math.hypot(h.vx, h.vy) * dt;
  if (G.hoof <= 0) { G.hoof = 34; sfx.hoof(); }
  if (Math.random() < dt * (h.s / 12 + sliding / 8)) G.dust.push({ x: h.x - Math.cos(h.hd) * 7, y: h.y - Math.sin(h.hd) * 7, t: 0 });
  stepDust(dt);
}
function trackBarrels(h) {
  // barrels: touch one and it tips over, plus 5 seconds
  G.barrels.forEach((b, i) => {
    if (!b.hit && Math.hypot(h.x - b.x, h.y - b.y) < 10) { b.hit = true; G.pen += 5; G.pop = { x: b.x, y: b.y - 10, t: 0 }; sfx.clang(); }
    // going all the way round it the right way counts; the wrong way doesn't
    if (i === G.next && !b.done) {
      const a = Math.atan2(h.y - b.y, h.x - b.x), d = Math.hypot(h.x - b.x, h.y - b.y);
      if (d > 110) { b.sum = 0; b.last = null; }
      else { if (b.last !== null) b.sum = Math.max(0, b.sum + wrap(a - b.last) * b.sign); b.last = a; }
      if (b.sum > 5.2) { b.done = true; G.next++; sfx.ding(); }
    }
  });
}
function trackPoles(h, oy) {
  G.poles.forEach(p => { if (!p.hit && Math.hypot(h.x - p.x, h.y - p.y) < 6) { p.hit = true; G.pen += 5; G.pop = { x: p.x, y: p.y - 10, t: 0 }; sfx.clang(); } });
  // each time the horse crosses the line of poles: the right gap, going the
  // opposite way to the last crossing, counts. Anything else doesn't, and the
  // rings stay put until it's ridden right.
  if ((oy - POLE.y) * (h.y - POLE.y) > 0 || oy === h.y || G.next >= WEAVE.length) return;
  const gap = Math.max(-1, Math.min(POLE.n - 1, Math.floor((h.x - POLE.x0) / POLE.gap))), way = Math.sign(h.y - oy);
  if (gap !== WEAVE[G.next] || (G.dir0 && way !== G.dir0 * (G.next % 2 ? -1 : 1))) return;
  if (!G.dir0) G.dir0 = way;
  G.next++; tone(660, .05, 'square', 0, .03);
}
// Roping. Decided 31 Oct: the catch works like fishing in Stardew Valley. Ride
// up on the steer, hold GO to swing the loop, let go to cast, then keep the dot
// in the moving green spot until the meter fills. The tie is the same thing,
// shorter and harder. One button, so it plays on a phone with one thumb.
const steerClose = () => Math.hypot(G.h.x - G.steer.x, G.h.y - G.steer.y);
function stepSteer(dt, speed) {
  const s = G.steer, F = FENCE, near = steerClose() < 45;
  G.cool = Math.max(0, G.cool - dt);
  s.s = speed + (near && G.phase === 'chase' ? TUNE.flee : 0);
  s.wait -= dt;
  if (s.wait <= 0) { s.want = s.hd + (Math.random() - .5) * 2.4; s.wait = .5 + Math.random() * .8; }
  if (s.x < F.x0 + 34 || s.x > F.x1 - 34 || s.y < F.y0 + 30 || s.y > F.y1 - 30) s.want = Math.atan2(93 - s.y, 160 - s.x);
  if (s.want !== undefined) { const d = wrap(s.want - s.hd), r = 2.6 * dt; s.hd = wrap(s.hd + Math.max(-r, Math.min(r, d))); }
  s.x = Math.max(F.x0 + 8, Math.min(F.x1 - 8, s.x + Math.cos(s.hd) * s.s * dt));
  s.y = Math.max(F.y0 + 8, Math.min(F.y1 - 8, s.y + Math.sin(s.hd) * s.s * dt));
  if (Math.random() < dt * 8) G.dust.push({ x: s.x - Math.cos(s.hd) * 8, y: s.y - Math.sin(s.hd) * 8, t: 0 });
  if (G.t > 45) finish(false);
  if (G.state === 'clock' && G.phase === 'chase' && G.held) G.heldT += dt;
}
function press() { G.held = true; G.heldT = 0; }
function release() {
  const swung = G.held && G.heldT >= TUNE.swing;
  G.held = false; G.heldT = 0;
  if (!C.rope || G.phase !== 'chase' || !swung || G.cool > 0) return;
  tone(520, .15, 'square', 0, .03, 900);
  if (steerClose() > TUNE.range) { G.cool = .7; G.pop = { x: G.h.x, y: G.h.y - 12, t: 0, say: 'MISS' }; tone(150, .1, 'square', .1, .04); return; }
  startMeter('rope', .3);
}
function startMeter(phase, m) { G.phase = phase; G.meter = { m, dot: .5, v: 0, c: .5, to: .7, wait: .5 }; }
function stepMeter(dt) {
  const M = G.meter, h = G.h, s = G.steer, tie = G.phase === 'tie', half = TUNE.green * (tie ? .75 : 1);
  G.t += dt;
  if (tie) G.h.s = 0;
  else {
    // the steer runs on at a lope with the horse behind it on the rope
    stepSteer(dt, 40);
    h.hd = Math.atan2(s.y - h.y, s.x - h.x);
