<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasure Trail</title>
<!-- Lexend is easier to read for dyslexic kids. Offline, it falls back to Verdana. -->
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#cfeaff; --ink:#23324a; --soft:#5b6b82; --card:#fffdf7;
  --gold:#ffc93c; --red:#ef5b5b; --blue:#4a90e2; --green:#3fb37f; --purple:#9b6ee8; --orange:#f59a3a;
  --shadow:0 6px 0 rgba(35,50,74,.15), 0 10px 24px rgba(35,50,74,.12);
  font-family: Lexend, Verdana, "Trebuchet MS", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(var(--sky),#eaf6ff 60%,#f3fbe9);color:var(--ink);font-size:20px;line-height:1.5;letter-spacing:.02em;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.soft{color:var(--soft);font-size:17px}
.credit svg{width:1.6em;vertical-align:-.45em}

.top{display:flex;align-items:center;gap:12px;padding:12px 20px}
.top h1{font-size:26px;margin:0;flex:1}
.pill{background:var(--card);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:600}
.btn{background:var(--card);border-radius:16px;padding:10px 18px;box-shadow:var(--shadow);font-weight:600}
.btn:active,.pill:active{transform:translateY(3px)}
.btn.big{font-size:24px;padding:16px 26px}
.btn.go{background:#d4f3e3}
.screen{display:none;padding:8px 20px 40px;max-width:1150px;margin:0 auto}
.screen.on{display:block}
.title{text-align:center;font-size:34px;margin:10px 0 20px}

/* Who's playing */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.pcard{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:26px 16px;text-align:center;position:relative;cursor:pointer}
.pcard .buddy{font-size:96px;line-height:1.1}
.pcard .name{font-size:30px;font-weight:800}
.pcard .edit{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;background:#eef2f8;font-size:22px}
.pcard.add{background:#f1f5fa}

/* The world */
.world{position:relative;width:100%;aspect-ratio:16/10;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);container-type:inline-size;cursor:pointer;
  background:
    radial-gradient(circle at 20% 80%, #9edc85 0 9%, transparent 9.2%),
    radial-gradient(circle at 85% 40%, #9edc85 0 7%, transparent 7.2%),
    linear-gradient(#a6e08f,#8fd17a)}
.path{position:absolute;inset:0;pointer-events:none}
.place,.deco,.me,.sprout,.gshiny{position:absolute;transform:translate(-50%,-50%)}
.place{text-align:center;cursor:pointer}
.place .icon{font-size:7cqw;line-height:1;filter:drop-shadow(0 .5cqw 0 rgba(0,0,0,.15))}
.place .sign{display:inline-block;background:#fff8e8;border:.3cqw solid #b98552;border-radius:1cqw;padding:.2cqw 1cqw;font-size:1.7cqw;font-weight:800;white-space:nowrap;margin-top:.4cqw}
.place.soon .icon{opacity:.6;filter:grayscale(.5)}
.place.near .icon{animation:hop .8s infinite}
.lake{position:absolute;transform:translate(-50%,-50%);width:22cqw;height:12cqw;border-radius:50%;background:radial-gradient(ellipse,#8fd3f5,#5fb4e6);box-shadow:inset 0 -1cqw 0 rgba(0,0,0,.08)}
.deco{font-size:4.5cqw;pointer-events:none}
.deco svg{width:4.5cqw;display:block}
.me{font-size:5.5cqw;line-height:1;z-index:5;pointer-events:none;transition:filter .2s}
.me.walk{animation:waddle .35s infinite}
.sprout{width:2.8cqw;z-index:4;pointer-events:none}
.sprout svg{width:100%;display:block}
.sprout.walk{animation:waddle .3s infinite}
.gshiny{font-size:3.4cqw;z-index:3;pointer-events:none;animation:twinkle 1.6s ease-in-out infinite}
.bubble{position:absolute;left:50%;bottom:2cqw;transform:translateX(-50%);background:#fff;border-radius:999px;padding:.6cqw 2cqw;font-size:2cqw;font-weight:700;box-shadow:var(--shadow);display:none;z-index:6;pointer-events:none}
.bubble.on{display:block}
.worldbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.worldbar h2{margin:0;font-size:28px}
@keyframes waddle{0%,100%{transform:translate(-50%,-50%) rotate(-6deg)}50%{transform:translate(-50%,-56%) rotate(6deg)}}
@keyframes twinkle{0%,100%{transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 2px #fff)}50%{transform:translate(-50%,-58%) scale(1.15);filter:drop-shadow(0 0 10px #fff8b0)}}

/* Game screen */
.gamebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gamebar h2{flex:1;margin:0;font-size:28px}
.levels{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.lvl{background:#fff;border-radius:999px;padding:8px 18px;box-shadow:var(--shadow);font-weight:600;font-size:18px}
.lvl.on{background:var(--gold)}
.lvl small{color:var(--soft)}
.prompt{display:flex;align-items:center;justify-content:center;gap:18px;min-height:120px;font-size:38px;font-weight:800;text-align:center;flex-wrap:wrap}
.prompt .big{font-size:76px;line-height:1;margin:0 6px}
.prompt .hint{display:block;font-size:20px;color:var(--soft);font-weight:600}
.buddy{font-size:64px;display:inline-block}
.hop{animation:hop .6s}
@keyframes hop{40%{transform:translateY(-24px) rotate(-8deg)}}
.stage{position:relative;border-radius:28px;min-height:420px;overflow:hidden;box-shadow:var(--shadow)}
#controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.dots{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px;font-size:24px}
.dots span{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.dots span.on{background:var(--gold)}

/* Tadpole Pond */
.pond{background:radial-gradient(ellipse at 50% 120%,#5fb4e6,#8fd3f5 60%,#bfe8fb);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:18px 26px;padding:30px}
.swimmer{width:160px;height:150px;animation:bob 2.8s ease-in-out infinite;transition:filter .2s}
.swimmer svg{width:100%;height:100%}
.swimmer text{font-family:inherit}
.swimmer.wobble{animation:wobble .5s}
.swimmer.yay{animation:yay .9s forwards}
.swimmer.hint{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 14px #ffd23f)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes wobble{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes yay{40%{transform:scale(1.25) rotate(360deg)}100%{transform:scale(1.15)}}

/* Block Tower */
.yard{background:linear-gradient(#dff2ff,#f2fbff);min-height:530px}
.ground{position:absolute;left:0;right:0;bottom:0;height:56px;background:#8fd17a;border-top:6px solid #6fb85a}
.sun{position:absolute;top:18px;right:28px;font-size:64px}
.tower{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center}
.brick{width:160px;height:36px;background:currentColor;border-radius:5px;position:relative;margin-top:9px;cursor:pointer;animation:drop .35s ease-out;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.3)}
.brick::before{content:'';position:absolute;top:-9px;left:18px;right:18px;height:10px;border-radius:4px 4px 0 0;background:repeating-linear-gradient(90deg,currentColor 0 24px,transparent 24px 46px)}
.brick.flash{outline:5px solid var(--ink)}
.brick.gone{animation:fly .45s forwards}
@keyframes drop{from{transform:translateY(-160px);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{to{transform:translate(220px,-120px) rotate(40deg);opacity:0}}
.choice{width:110px;height:110px;font-size:52px;font-weight:800;border-radius:26px}
.choice.right{background:var(--green);color:#fff}
.choice.wrong{opacity:.4}

/* Letter Train */
.rail{background:linear-gradient(#fff6e5 0 72%,#c9e9b8 72%);min-height:300px}
.track{position:absolute;left:0;right:0;bottom:52px;height:12px;border-top:5px solid #6b7b8f;background:repeating-linear-gradient(90deg,#8a6a4a 0 18px,transparent 18px 34px)}
.train{position:absolute;left:0;bottom:72px;display:flex;align-items:flex-end;gap:12px;transition:transform .45s ease;padding-left:20px}
.engine{font-size:110px;line-height:1;margin-bottom:-18px}
.car{position:relative;min-width:96px;height:84px;padding:0 18px;background:var(--red);border-radius:14px 14px 8px 8px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#fff;letter-spacing:.06em;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.car:nth-child(3n){background:var(--blue)}
.car:nth-child(3n+1){background:var(--purple)}
.car::before,.car::after{content:'';position:absolute;bottom:-18px;width:28px;height:28px;border-radius:50%;background:var(--ink);border:5px solid #9aa7b8}
.car::before{left:12px}.car::after{right:12px}
.car.now{outline:6px solid var(--gold);outline-offset:4px}
.car.done{background:var(--green)!important}
.car span.typed{opacity:.45}
.car span.next{text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:5px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.kb{display:inline-block;padding:14px;background:#fff;border-radius:18px;box-shadow:var(--shadow)}
.kbrow{display:flex;gap:6px;margin-bottom:6px}
.k{width:54px;height:54px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;position:relative;border-bottom:4px solid rgba(0,0,0,.15);cursor:pointer}
.f-p{background:#e8dcff}.f-r{background:#d6e8ff}.f-m{background:#d4f3e3}.f-i{background:#ffe2c8}
.k.bump::after{content:'';position:absolute;bottom:8px;width:14px;height:3px;border-radius:2px;background:var(--ink)}
.k.target{background:var(--gold);transform:translateY(-4px) scale(1.08);box-shadow:0 0 0 4px var(--ink)}

/* Treasure shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;background:#d7a46f;padding:20px;border-radius:24px;margin-top:14px;box-shadow:var(--shadow),inset 0 0 0 8px #b98552}
.item{background:#f4dcbc;border-radius:16px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:56px;position:relative;line-height:1.2}
.item small{font-size:15px}
.item.locked .e{filter:grayscale(1) brightness(0);opacity:.18}
.item .n{position:absolute;top:6px;right:8px;background:var(--ink);color:#fff;border-radius:999px;font-size:14px;padding:0 8px}
.sprouts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sprouts div{width:40px}

/* Pop-ups */
.overlay{position:fixed;inset:0;background:rgba(35,50,74,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.overlay.on{display:flex}
.card{background:var(--card);border-radius:30px;padding:30px 36px;text-align:center;max-width:580px;width:100%;box-shadow:var(--shadow)}
.card h2{margin:6px 0}
.bigShiny{font-size:150px;line-height:1.1;animation:shine 1.4s ease-out}
@keyframes shine{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.2) rotate(10deg);opacity:1}100%{transform:scale(1)}}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
#eName{font:inherit;font-size:26px;padding:10px 16px;border-radius:14px;border:3px solid #cdd6e3;width:100%;margin:10px 0 16px}
.buddies{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bud{font-size:40px;width:66px;height:66px;border-radius:16px;background:#f0f3f8}
.bud.on{background:var(--gold)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120%);background:#fff;border-radius:999px;padding:10px 24px;font-weight:800;box-shadow:var(--shadow);z-index:20;transition:transform .3s}
.toast.on{transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <h1>🗺️ Treasure Trail</h1>
  <button class="pill" id="playerBtn" hidden></button>
  <button class="pill" id="soundBtn" aria-label="Sound on or off">🔊</button>
</header>

<section id="s-who" class="screen">
  <h2 class="title">Who's playing?</h2>
  <div class="players" id="players"></div>
  <p class="soft" style="text-align:center;margin-top:30px"><span class="credit"></span> Made by Rubber Duck Games</p>
</section>

<section id="s-map" class="screen">
  <div class="worldbar">
    <h2 id="hello"></h2>
    <span class="soft">Click to walk, or use the arrow keys</span>
  </div>
  <div class="world" id="world">
    <svg class="path" viewBox="0 0 1000 625" preserveAspectRatio="none" aria-hidden="true">
      <path d="M220 200 Q360 300 500 340 T780 180 M500 340 Q620 420 760 470 M500 340 Q380 420 240 480 M500 340 L500 110"
        fill="none" stroke="#e8d3a8" stroke-width="34" stroke-linecap="round"/>
    </svg>
    <div class="lake" style="left:22%;top:32%"></div>
    <div id="places"></div>
    <div id="decos"></div>
    <div id="ground"></div>
    <div id="sproutLine"></div>
    <div class="me" id="me"></div>
    <div class="bubble" id="bubble"></div>
  </div>
</section>

<section id="s-game" class="screen">
  <div class="gamebar">
    <button class="btn" data-go="map">🗺️ Back to map</button>
    <h2 id="gTitle"></h2>
    <button class="btn" id="hearBtn">🔊 Hear it</button>
  </div>
  <div class="levels" id="levels"></div>
  <div class="prompt" id="prompt"></div>
  <div class="stage" id="stage"></div>
  <div id="controls"></div>
  <div class="dots" id="dots"></div>
</section>

<section id="s-shelf" class="screen">
  <div class="gamebar">
    <button class="btn" data-go="map">🗺️ Back to map</button>
    <h2 id="shelfTitle"></h2>
  </div>
  <div class="shelf" id="shelf"></div>
  <h3 id="sproutTitle"></h3>
  <div class="sprouts" id="sproutList"></div>
</section>

<div class="overlay" id="reward">
  <div class="card">
    <div class="bigShiny" id="rShiny"></div>
    <h2 id="rText"></h2>
    <p class="soft" id="rSub"></p>
    <div class="row">
      <button class="btn big go" id="rAgain">Play again</button>
      <button class="btn big" id="rMap">Back to map</button>
    </div>
  </div>
</div>

<div class="overlay" id="edit">
  <div class="card">
    <h2>Player</h2>
    <input id="eName" maxlength="14" placeholder="Name" aria-label="Name">
    <div class="buddies" id="eBuddies"></div>
    <div class="row">
      <button class="btn big go" id="eSave">Save</button>
      <button class="btn big" id="eCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const rand = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const art = w => /^[aeiou]/i.test(w) ? 'an' : 'a';

// ---------- Content ----------
const LETTERS = { A: ['apple', '🍎'], B: ['bear', '🐻'], C: ['cat', '🐱'], D: ['duck', '🦆'], E: ['egg', '🥚'], F: ['fish', '🐟'], G: ['goat', '🐐'], H: ['hat', '🎩'], I: ['insect', '🐞'], J: ['juice', '🧃'], K: ['kite', '🪁'], L: ['lion', '🦁'], M: ['moon', '🌙'], N: ['nose', '👃'], O: ['octopus', '🐙'], P: ['pig', '🐷'], Q: ['queen', '👑'], R: ['rabbit', '🐰'], S: ['sun', '☀️'], T: ['train', '🚂'], U: ['umbrella', '☂️'], V: ['van', '🚐'], W: ['whale', '🐳'], X: ['fox', '🦊'], Y: ['yo-yo', '🪀'], Z: ['zebra', '🦓'] };
const ALPHA = Object.keys(LETTERS);
const phrase = L => L === 'X' ? 'X. Fox ends with X.' : `${L}. ${L} is for ${LETTERS[L][0]}.`;

const SHINIES = [['💎', 'blue gem'], ['🐚', 'sea shell'], ['🌰', 'acorn'], ['🪙', 'gold coin'], ['🔮', 'crystal ball'], ['🍀', 'lucky clover'], ['🪶', 'feather'], ['⭐', 'gold star'], ['🗝️', 'old key'], ['🔔', 'little bell'], ['🪨', 'smooth rock'], ['🧭', 'compass'], ['🐞', 'ladybug'], ['🌸', 'flower'], ['🍄', 'mushroom'], ['🧲', 'magnet'], ['🫧', 'bubble'], ['🦋', 'butterfly'], ['🌈', 'rainbow'], ['🐌', 'snail']];
const BUDDIES = ['🐈‍⬛', '🐕', '🦆', '🦹', '🦸', '🚂', '⛵', '🚀', '🦖', '🐉', '🦉', '🐙', '🤖', '🦊', '🐢', '👾'];
const SPROUT_COLORS = ['#ef5b5b', '#4a90e2', '#ffc93c', '#9b6ee8', '#f59a3a', '#3fb37f', '#ff8fc7', '#5ad1d1'];
const WORDS = ['cat', 'sun', 'map', 'duck', 'boat', 'ship', 'star', 'moon', 'frog', 'gem', 'lego', 'key', 'train', 'rocket', 'corgi', 'ocean', 'castle', 'dragon', 'planet', 'shell', 'robot', 'comet'];
const FINGER = { q: 'p', a: 'p', z: 'p', w: 'r', s: 'r', x: 'r', e: 'm', d: 'm', c: 'm', r: 'i', f: 'i', v: 'i', t: 'i', g: 'i', b: 'i', y: 'i', h: 'i', n: 'i', u: 'i', j: 'i', m: 'i', i: 'm', k: 'm', ',': 'm', o: 'r', l: 'r', '.': 'r', p: 'p', ';': 'p', '/': 'p' };
const FINGER_NAME = { p: 'pinky', r: 'ring finger', m: 'middle finger', i: 'pointer finger' };

// Places in the world. x/y are on a 1000 x 625 map.
const PLACES = [
  { id: 'pond', icon: '🐸', name: 'Tadpole Pond', x: 220, y: 200, levels: ['Tap and hear', 'Find the letter', 'First sounds', 'Big and little'] },
  { id: 'tower', icon: '🧱', name: 'Block Tower', x: 780, y: 180, levels: ['Build to 5', 'Build to 10', 'Adding', 'Taking away'] },
  { id: 'train', icon: '🚂', name: 'Letter Train', x: 760, y: 470, levels: ['F and J', 'Home row', 'More keys', 'Words'] },
  { id: 'shelf', icon: '🏠', name: 'My Treasures', x: 500, y: 330 },
  { id: 'space', icon: '🚀', name: 'Space Lab', x: 500, y: 95, soon: true },
  { id: 'story', icon: '📚', name: 'Story Tree', x: 240, y: 480, soon: true },
];
const DECOS = [['duck', 290, 165], ['🌳', 60, 70], ['🌲', 110, 330], ['🌳', 380, 560], ['🌲', 640, 80], ['🌳', 930, 320], ['🌻', 610, 560], ['🌷', 400, 190], ['🌲', 950, 560], ['🪨', 660, 300], ['🍄', 90, 580]];

// ---------- Save data (stays on this computer) ----------
function load() { try { return JSON.parse(localStorage.getItem('treasure-trail')) || null; } catch (e) { return null; } }
function persist() { try { localStorage.setItem('treasure-trail', JSON.stringify(save)); } catch (e) { } }
const newPlayer = (name, buddy) => ({ name, buddy, shinies: [], done: {}, last: {}, sprouts: 0 });
let save = load() || { sound: true, current: null, players: [newPlayer('Player 1', '🐈‍⬛'), newPlayer('Player 2', '🐕'), newPlayer('Player 3', '🦆')] };
save.players.forEach(p => { p.shinies ??= []; p.done ??= {}; p.last ??= {}; p.sprouts ??= 0; });
const player = () => save.players[save.current];

// ---------- Voice and sounds ----------
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'en-US' && /Samantha|Google US|Aria|Jenny|Ava/.test(v.name)) || vs.find(v => v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t) {
  if (!t || !save.sound || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  if (voice) u.voice = voice;
  u.rate = .9; u.pitch = 1.1;
  speechSynthesis.speak(u);
}
let ac;
function tone(freq, dur = .15, type = 'sine', when = 0, vol = .15, slideTo) {
  if (!save.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);

      const top = this.bricks().at(-1); top.classList.add('gone'); setTimeout(() => top.remove(), 450);
      cur.taken++; sfx.pop(); say(String(cur.taken));
      if (cur.taken === cur.k) {
        setPrompt(`${cur.start} take away ${cur.k} = ?`, 'How many blocks are left?', true);
        setTimeout(() => { say(cur.say); this.choices(); }, 700);
      }
      return;
    }
    // Tapping a block says its number, to help with counting.
    const i = this.bricks().indexOf(b) + 1;
    b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 400); say(String(i));
  },
  act(a, btn) {
    if (cur.busy) return;
    const l = cur.level, c = this.bricks().length;
    if (a === 'add') {
      if (c >= 10) return say('That is as tall as it goes!');
      this.brick(BRICK_COLORS[c % 6]); sfx.pop(); say(String(c + 1));
      if (l === 0 && c + 1 === cur.n) setTimeout(() => this.win(`${cur.n}! You built ${cur.n}!`), 500);
    } else if (a === 'take') {
      if (!c) return;
      this.bricks().at(-1).remove(); sfx.pop(); say(c - 1 ? String(c - 1) : 'Zero');
    } else if (a === 'done') {
      if (c === cur.n) this.win(`Yes! ${cur.n} blocks!`);
      else { sfx.oops(); cur.misses++; say(`You have ${c}. We need ${cur.n}. ${c > cur.n ? 'Take some off.' : 'Add some more.'}`); }
    } else if (a === 'pick') {
      if (+btn.dataset.v === cur.n) { btn.classList.add('right'); this.win(`Yes! ${cur.n}!`); }
      else { btn.classList.add('wrong'); sfx.oops(); cur.misses++; this.countAlong(); }
    }
  },
  win(msg) {
    const c = cur; cur.busy = true; sfx.good(); cheer(); say(msg);
    if (!stepDone()) setTimeout(() => { if (alive(c)) this.next(); }, 1800);
  },
  async countAlong() {
    const c = cur, bs = this.bricks(); cur.busy = true;
    say("Let's count them together."); await wait(1500);
    for (let i = 0; i < bs.length; i++) {
      if (!alive(c)) return;
      bs[i].classList.add('flash'); say(String(i + 1)); await wait(750); bs[i].classList.remove('flash');
    }
    if (alive(c)) cur.busy = false;
  },
};

// ---------- Letter Train (typing) ----------
const LEFT_KEYS = 'qwertasdfgzxcvb';
G.train = {
  start(l) {
    const st = $('#stage'); st.classList.add('rail');
    const pools = ['fj', 'asdfjkl', 'asdfghjkleiru'];
    let items = [];
    if (l < 3) while (items.length < 12) { const c = rand(pools[l]); if (!(items.at(-1) === c && items.at(-2) === c)) items.push(c); }
    else items = shuffle(WORDS).slice(0, 6);
    Object.assign(cur, { items, total: items.length, i: 0, pos: 0, keys: 0, tStart: 0 });
    st.innerHTML = `<div class="track"></div><div class="train" id="train"><div class="engine">🚂</div>${items.map((w, i) => `<div class="car" data-i="${i}">${[...w].map(ch => `<span>${ch}</span>`).join('')}</div>`).join('')}</div>`;
    $('#controls').innerHTML = '<div class="kb">' + ['qwertyuiop', 'asdfghjkl;', 'zxcvbnm,./'].map((r, ri) =>
      `<div class="kbrow" style="margin-left:${ri * 22}px">${[...r].map(c => `<div class="k f-${FINGER[c]}${c === 'f' || c === 'j' ? ' bump' : ''}" data-a="key" data-k="${c}">${c}</div>`).join('')}</div>`).join('') + '</div>';
    requestAnimationFrame(() => this.focus());
  },
  focus() {
    const w = cur.items[cur.i], ch = w[cur.pos];
    document.querySelectorAll('.car').forEach((el, i) => el.classList.toggle('now', i === cur.i));
    const car = document.querySelector(`.car[data-i="${cur.i}"]`);
    [...car.children].forEach((s, j) => { s.classList.toggle('typed', j < cur.pos); s.classList.toggle('next', j === cur.pos && w.length > 1); });
    document.querySelectorAll('.k').forEach(k => k.classList.toggle('target', k.dataset.k === ch));
    const st = $('#stage');
    $('#train').style.transform = `translateX(${st.clientWidth * .45 - (car.offsetLeft + car.offsetWidth / 2)}px)`;
    if (cur.pos === 0) {
      const hint = `${LEFT_KEYS.includes(ch) ? 'Left' : 'Right'} ${FINGER_NAME[FINGER[ch]]}`;
      if (w.length === 1) setPrompt(`Type <span class="big">${ch}</span><span class="hint">${hint}</span>`, ch.toUpperCase());
      else setPrompt(`Type <span class="big">${w}</span>`, w);
    }
  },
  act(a, btn) { if (a === 'key' && !cur.busy) this.key(btn.dataset.k); },
  key(k) {
    if (!cur.tStart) cur.tStart = Date.now();
    const w = cur.items[cur.i], want = w[cur.pos];
    const car = document.querySelector(`.car[data-i="${cur.i}"]`);
    cur.keys++;
    if (k === want) {
      cur.pos++; sfx.chug();
      if (cur.pos >= w.length) {
        car.classList.add('done'); sfx.good(); cur.i++; cur.pos = 0;
        if (stepDone()) { cur.busy = true; this.summary(); cheer(); return; }
      }
      this.focus();
    } else {
      sfx.oops();
      car.classList.remove('shake'); void car.offsetWidth; car.classList.add('shake');
    }
  },
  summary() {
    const letters = cur.items.join('').length;
    const mins = (Date.now() - cur.tStart) / 60000;
    const acc = Math.round(100 * letters / cur.keys);
    cur.sub = `${acc}% of your keys were right · ${Math.round(letters / Math.max(mins, .05))} letters a minute`;
  },
};

// ---------- Keyboard ----------
document.addEventListener('keydown', e => {
  if ($('.overlay.on') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (screen === 'map') {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(k)) { W.keys[k] = true; e.preventDefault(); }
    if ((k === 'Enter' || k === ' ') && W.near) { e.preventDefault(); enterPlace(W.near.id); }
    return;
  }
  if (screen === 'game' && cur?.zone.id === 'train' && !cur.busy && e.key.length === 1) {
    e.preventDefault(); G.train.key(e.key.toLowerCase());
  }
});
document.addEventListener('keyup', e => { W.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
window.addEventListener('blur', () => { W.keys = {}; });

document.querySelector('.credit').innerHTML = rubberDuckSVG();
drawSound();
showWho();
</script>
