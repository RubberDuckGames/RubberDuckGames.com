<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombies of Tomorrow: the flight</title>
<style>
  :root { --ink:#1b1a2e; --night:#141b38; --cream:#f6efdc; --mustard:#e8b33c; --teal:#3f9c96; --red:#c8423b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--night); color:var(--cream); font-family: "Trebuchet MS", Verdana, sans-serif; }
  #wrap { position:relative; width:min(100vw, 960px); margin:0 auto; padding-top:8px; }
  canvas { display:block; width:100%; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; border:3px solid var(--ink); touch-action:none; }
  #prompt { min-height:30px; margin-top:6px; font-size:18px; display:flex; justify-content:space-between; gap:12px; }
  #prompt .home { color:var(--mustard); white-space:nowrap; }
  #prompt .keys { opacity:.7; font-size:14px; text-align:right; }
  #card { position:absolute; left:0; right:0; top:8px; bottom:0; background:rgba(20,27,56,.94); display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:22px; line-height:1.5; }
  #card h1 { color:var(--mustard); font-size:32px; margin:0 0 8px; letter-spacing:2px; }
  #card .small { font-size:16px; opacity:.8; }
  #card .row { margin-top:18px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  button { font:inherit; font-size:18px; background:var(--mustard); color:var(--ink); border:3px solid var(--ink); padding:6px 16px; cursor:pointer; }
  button.alt { background:var(--teal); color:var(--cream); }
</style>
<link rel="stylesheet" href="touch.css?v=202611270900">
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="640" height="400"></canvas>
  <div id="prompt"><a class="home" href="../">&larr; All games</a><span id="hint"></span><span class="keys">Fly: arrows or WASD · Shoot: Space or F · Phone: the stick flies, Shoot shoots</span></div>
  <div id="card"></div>
</div>
<div class="ctrl" aria-label="Phone controls">
  <div class="stick" id="stick" aria-label="Fly"><i id="knob"></i></div>
  <div class="btns">
    <button class="rb" data-code="Space">Shoot</button>
  </div>
</div>
<script src="touch.js?v=202611270900"></script>
<script src="flight_art.js?v=202611270900"></script>
<script src="flight.js?v=202611270900"></script>
</body>
</html>
