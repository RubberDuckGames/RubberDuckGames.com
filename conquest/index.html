<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conquest · Rubber Duck Games</title>
<meta name="description" content="A turn-based war game: move your army, take the cities and win the map.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Decided 4 Nov: a WW2 world, worn and faded rather than bright and happy. */
:root{--ink:#e8dfc8;--soft:#b9ad92;--bg:#2b2a22;--panel:#3b382c;--line:#5d5843;--accent:#c9a44a;--you:#68743e;--cpu:#963e30;font-family:Lexend,Verdana,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;touch-action:manipulation}
body{font-size:1.0625rem;line-height:1.45;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;flex-wrap:wrap}
.bar .grow{flex:1}
.pill{background:var(--panel);border:2px solid var(--line);padding:.375rem .75rem;white-space:nowrap;text-decoration:none;color:inherit;font-family:"Press Start 2P",monospace;font-size:.65rem;line-height:1.6;box-shadow:.2rem .2rem 0 #1b1a15}
.game{display:flex;gap:1rem;justify-content:center;align-items:flex-start;padding:0 .75rem 1rem;flex-wrap:wrap}
.mapbox{position:relative;width:min(100%, calc((100vh - 5rem) * 12 / 14));width:min(100%, calc((100dvh - 5rem) * 12 / 14))}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#4a4834;border:3px solid #1b1a15;touch-action:none}
.side{flex:1 1 18rem;max-width:26rem;display:flex;flex-direction:column;gap:.75rem}
.info{background:var(--panel);border:2px solid var(--line);padding:.9rem 1rem;min-height:8rem}
.info h2{margin:0 0 .4rem;font-family:"Press Start 2P",monospace;font-size:.8rem;line-height:1.6}
.info p{margin:.3rem 0;color:var(--soft)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:.1rem .8rem;margin:.4rem 0}
.stats dt{color:var(--soft)}
.stats dd{margin:0}
.shop{display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem}
.buy{display:flex;align-items:center;gap:.6rem;background:#2f2d23;border:2px solid var(--line);padding:.35rem .6rem;text-align:left}
.buy img{width:2.2rem;height:2.2rem;object-fit:contain;image-rendering:pixelated}
.buy span{flex:1}
.buy b{font-family:"Press Start 2P",monospace;font-size:.6rem}
.buy:disabled{opacity:.5;cursor:default}
.grp{margin:.8rem 0 0!important;font-family:"Press Start 2P",monospace;font-size:.6rem;color:var(--accent)!important}
.actions{display:flex;justify-content:flex-end;gap:.6rem;flex-wrap:wrap}
.btn{background:var(--accent);color:#211f18;padding:.8rem 1.1rem;font-family:"Press Start 2P",monospace;font-size:.7rem;line-height:1.6;box-shadow:.25rem .25rem 0 #1b1a15}
.btn.quiet{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.log{font-size:.95rem;color:var(--soft);margin:0}
.cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,18,12,.7);z-index:9;padding:1rem;overflow:auto}
.card{background:var(--panel);border:4px solid #1b1a15;padding:1.25rem;max-width:28rem;width:100%;box-shadow:.4rem .4rem 0 rgba(0,0,0,.35)}
.card h1,.card h2{margin:0 0 .6rem;font-family:"Press Start 2P",monospace;font-size:1.3rem;line-height:1.5;color:var(--accent)}
.card p{margin:.4rem 0}
.card ul{margin:.4rem 0;padding-left:1.2rem}
.row{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
</style>
</head>
<body>
<div class="bar">
  <a class="pill" href="../" id="backLink"></a>
  <span class="grow"></span>
  <span class="pill" id="hTurn"></span>
  <span class="pill" id="hMoney"></span>
  <button class="pill" id="soundBtn"></button>
</div>
<main class="game">
  <div class="mapbox"><canvas id="cv" width="576" height="672" tabindex="0"></canvas></div>
  <div class="side">
    <section class="info" id="info" aria-live="polite"></section>
    <p class="log" id="log" aria-live="polite"></p>
    <div class="actions"><button class="btn" id="endBtn"></button></div>
  </div>
</main>
<div class="cover" id="cover"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<script>
// Conquest (Trello #47). Designed by the oldest kid tester: his units, his
// stats, his own drawings. Decided 4 Nov: turn based; money from taking cities
// (trade routes with allies come later); you win by taking every city or by
// being the last army on the map. The first version was land only.
// Decided 4 Nov, after his first long game ended in a stalemate at turn 80
// (guns too strong to break from the ground): aircraft. Planes and helicopters
// fly over anything, and only units that fire at air can hit them in the air.
// Planes carry about 10 squares of fuel (five out, five back) and land in your
// own cities to fill up; a landed plane can be hit by anyone. Helicopters can
// hover as long as they like. The artillery gun was too strong, so after it
// fires it reloads through your next turn. Ships, transports, trade and
// alliances come with his own map (Trello #47).

// ---------- words ----------
const STR = {
  back: '← All games',
  turn: 'Turn {n}',
  money: 'Money {m}',
  soundOn: '🔔', soundOff: '🔕', soundLabel: 'Sounds on or off',
  endTurn: 'End turn',
  enemyTurn: 'Enemy turn…',
  title: 'Conquest',
  intro: 'Take every city on the map to win.',
  how1: 'Tap one of your units to see where it can go. Tap a square to move there.',
  how2: 'Then tap an enemy with a red box to fire at it.',
  how3: 'Each city gives you money every turn. Tap a city you own to buy more units there.',
  how4: 'When your units are done, press End turn.',
  how5: 'Planes and helicopters fly over anything. In the air, only units that fire at air can hit them.',
  how6: 'Planes carry 10 fuel. Land them in one of your cities to fill up, or they crash. A landed plane can be hit by anyone.',
  start: 'Start',
  keepPlaying: 'Keep playing',
  newGame: 'New game',
  newSure: 'Start a new game? The game you are in now will be gone.',
  cancel: 'Cancel',
  startNew: 'Start new game',
  won: 'You won!',
  wonAll: 'Every city on the map is yours.',
  wonLast: 'Your army is the last one standing.',
  lost: 'The enemy won this time.',
  lostWhy: 'They took the map. Try a new plan!',
  playAgain: 'Play again',
  statTurns: 'Turns: {n}',
  statTaken: 'Cities you took: {n}',
  statKilled: 'Enemy units knocked out: {n}',
  statLost: 'Units you lost: {n}',
  pickHint: 'Tap one of your units or cities.',
  yours: 'Yours', enemy: 'Enemy',
  hp: 'Health', dmg: 'Damage', rng: 'Range', spd: 'Speed', cost: 'Cost', hits: 'Fires at',
  ground: 'Ground', air: 'Air', groundAir: 'Ground and air',
  staysPut: 'Stays where it is put',
  spaces: '{n} spaces',
  hpOf: '{n} of {max}',
  canMove: 'Tap a lit square to move.',
  canFire: 'Tap an enemy with a red box to fire.',
  done: 'This unit is done for this turn.',
  newUnit: 'Just arrived. It can move next turn.',
  cityYours: 'Your city', cityEnemy: 'Enemy city', cityFree: 'Free city',
  hqYours: 'Your capital', hqEnemy: 'Enemy capital',
  cityGives: 'Gives {m} money each turn.',
  cityTake: 'Move a unit onto it to take it.',
  buyHere: 'Buy a unit here:',
  cityBusy: 'There is no room around this city. Move a unit away to buy here.',
  cityAgain: 'Tap it again to buy in this city.',
  need: 'Need {m}',
  bought: 'A new {unit} is ready. It can move next turn.',
  took: 'You took a city!',
  lostCity: 'The enemy took one of your cities.',
  hit: '{a} hit the {b}.',
  knocked: 'The {b} is knocked out!',
  yourTurn: 'Your turn. You got {m} money from your cities.',
  dmgSplit: '{a} to air, {g} to ground',
  fuel: 'Fuel', fuelOf: '{n} of {max}',
  hovers: 'Can hover in one place',
  landed: 'Landed in your city. It fills up with fuel next turn. Anyone can hit it here.',
  lowFuel: 'Low on fuel! Land in one of your cities soon or it will crash.',
  reloading: 'Reloading. It can fire again next turn.',
  burning: 'On fire! It loses 1 health a turn for {n} more turns.',
  onFire: 'It is on fire!',
  crashed: 'A {unit} ran out of fuel and crashed.',
  burnedOut: 'A {unit} burned up.',
  caught: 'A {unit} was caught on the ground when its city fell.',
  noRoom: 'No room',
  shopGround: 'Ground', shopGuns: 'Guns', shopAir: 'Aircraft',
};
const t = (k, v = {}) => STR[k].replace(/\{(\w+)\}/g, (_, x) => v[x]);

// ---------- his units ----------
// hp, damage (dmg to ground, dmgA to air), range, speed, cost, what it fires at
// (G ground, A air). Copied from his sheets. air: 'plane' or 'heli'.
const UNITS = {
  soldier:       { name: 'Soldier',               img: 'soldier',          hp: 1,   dmg: 1,                rng: 2, spd: 2, cost: 1,   hits: 'G' },
  tank:          { name: 'Tank',                  img: 'tank',             hp: 2,   dmg: 1,                rng: 3, spd: 2, cost: 2,   hits: 'G' },
  tankDestroyer: { name: 'Tank destroyer',        img: 'tank-destroyer',   hp: 2,   dmg: 2,                rng: 4, spd: 1, cost: 2,   hits: 'G' },
  aaTank:        { name: 'AA tank',               img: 'aa-tank',          hp: 2,   dmg: 1.5, dmgA: 1.5,   rng: 2, spd: 2, cost: 2.5, hits: 'GA' },
  defenseGun:    { name: 'Defense gun',           img: 'defense-gun',      hp: 1.5, dmg: 2,                rng: 2, spd: 0, cost: 3,   hits: 'G', fixed: true },
  artillery:     { name: 'Artillery gun',         img: 'artillery',        hp: 3,   dmg: 2,                rng: 5, spd: 0, cost: 5,   hits: 'G', fixed: true, reload: true },
  aaGun:         { name: 'AA gun',                img: 'aa-gun',           hp: 3,   dmgA: 2,               rng: 3, spd: 0, cost: 3,   hits: 'A', fixed: true },
  missileAA:     { name: 'Missile AA',            img: 'missile-aa',       hp: 3,   dmgA: 4,               rng: 3, spd: 0, cost: 5,   hits: 'A', fixed: true },
  groundChopper: { name: 'Ground attack chopper', img: 'attack-chopper-g', hp: 4,   dmg: 3,                rng: 4, spd: 4, cost: 3,   hits: 'G',  air: 'heli' },
  attackChopper: { name: 'Attack chopper',        img: 'attack-chopper',   hp: 2.5, dmg: 1,   dmgA: 2,     rng: 3, spd: 4, cost: 3,   hits: 'GA', air: 'heli' },
  attackJet:     { name: 'Ground attack jet',     img: 'attack-jet',       hp: 3.5, dmg: 3,                rng: 3, spd: 4, cost: 3,   hits: 'G',  air: 'plane' },
  interceptor:   { name: 'Interceptor',           img: 'interceptor',      hp: 3,   dmg: 2,   dmgA: 2,     rng: 3, spd: 4, cost: 3,   hits: 'GA', air: 'plane' },
  bomber:        { name: 'Bomber',                img: 'bomber',           hp: 4,   dmg: 4.5, dmgA: 2,     rng: 3, spd: 3, cost: 4,   hits: 'GA', air: 'plane' },
  groundBomber:  { name: 'Ground attack bomber',  img: 'ground-bomber',    hp: 4,   dmg: 3,   dmgA: 2.4,   rng: 4, spd: 3, cost: 4,   hits: 'GA', air: 'plane', fire: true },
};
const SHOP_GROUPS = [
  ['shopGround', ['soldier', 'tank', 'tankDestroyer', 'aaTank']],
  ['shopGuns', ['defenseGun', 'artillery', 'aaGun', 'missileAA']],
  ['shopAir', ['groundChopper', 'attackChopper', 'attackJet', 'interceptor', 'bomber', 'groundBomber']],
];
const SHOP = SHOP_GROUPS.flatMap(g => g[1]);
const AIR = SHOP_GROUPS[2][1];
const FUEL = 10, CIRCLE = 2;   // a plane's full tank, and what a turn in the air without moving burns
const BURN = 1, BURN_TURNS = 2; // his fire burns 2 more turns after the hit; 1 health a turn is a guess to check with him
// Decided 4 Nov: the green parts of his drawings are the team's colour.
const TEAM = { you: [104, 116, 62], cpu: [150, 62, 48] };

// ---------- the map ----------
// . open ground, f forest (2 to cross), w water, m mountain, c city,
// E the enemy's capital, P yours. The bottom half is the top half turned round.
const TOP = [
  'mm...E....ff',
  'm..c....f...',
  '...ff..w...c',
  'c..f..ww....',
  '....f.w..ff.',
  '.ww....c....',
  '..ww...f.w..',
];
const MAP = [...TOP, ...TOP.slice().reverse().map(r => [...r].reverse().join('').replace('E', 'P'))];
const MW = 12, MH = 14, TS = 48;
const tileAt = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? 'm' : MAP[y][x];
const moveCost = ch => ch === 'f' ? 2 : (ch === 'w' || ch === 'm') ? Infinity : 1;
const HQ_MONEY = 3, CITY_MONEY = 1;

// ---------- state ----------
const KEY = 'conquest';
const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const PREFS = Object.assign({ sound: true }, read().prefs);
let G = null;          // the game in play
let sel = null;        // { unit } or { city }
let busy = false;      // true while the enemy moves or a shot plays
let fx = [];           // shots, booms and floating numbers
let banner = null;     // { text, until }
let cursor = { x: 6, y: 12 };
let uid = 1;

function newGame() {
  const cities = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const ch = MAP[y][x];
    if (ch === 'c' || ch === 'E' || ch === 'P') cities.push({ x, y, hq: ch !== 'c', owner: ch === 'E' ? 'cpu' : ch === 'P' ? 'you' : null });
  }
  G = { v: 1, turn: 1, side: 'you', money: { you: 3, cpu: 3 }, cities, units: [], stats: { taken: 0, killed: 0, lost: 0 } };
  const put = (type, side, x, y) => G.units.push(mkUnit(type, side, x, y));
  put('soldier', 'you', 5, 12); put('tank', 'you', 6, 12); put('soldier', 'you', 7, 12);
  put('soldier', 'cpu', 6, 1); put('tank', 'cpu', 5, 1); put('soldier', 'cpu', 4, 1);
  startTurn('you');
}
function mkUnit(type, side, x, y) {
  const u = { id: uid++, type, side, x, y, px: x, py: y, hp: UNITS[type].hp, moved: false, acted: false, fresh: false, ang: side === 'you' ? 0 : Math.PI };
  if (UNITS[type].air === 'plane') { u.fuel = FUEL; u.landed = !!(cityAt(x, y)?.owner === side); }
  return u;
}
function save() {
  const s = read(); s.prefs = PREFS;
  s.game = G && !G.over ? { ...G, units: G.units.map(u => ({ ...u, px: u.x, py: u.y })) } : null;
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { }
}

// ---------- rules ----------
// Air and ground are two layers: a square holds one ground unit and one air
// unit, the air one flying above. A landed plane still takes the air spot.
const layerOf = u => UNITS[u.type].air ? 'air' : 'ground';
const isAir = u => !!UNITS[u.type].air && !u.landed;
const unitAt = (x, y, layer) => G.units.find(u => u.x === x && u.y === y && (!layer || layerOf(u) === layer));
const unitsAt = (x, y) => G.units.filter(u => u.x === x && u.y === y).sort((a, b) => isAir(b) - isAir(a));
const cityAt = (x, y) => G.cities.find(c => c.x === x && c.y === y);
const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const other = s => s === 'you' ? 'cpu' : 'you';
const fmt = n => String(Math.round(n * 10) / 10);
const inMap = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const canHit = (R, o) => isAir(o) ? R.hits.includes('A') : R.hits.includes('G');
const dmgTo = (R, o) => isAir(o) ? R.dmgA : R.dmg;

// Squares a unit can reach this turn. On the ground: forest costs 2, water and
// mountains can't be crossed, it can pass its own side's units but not stop
// on them, and it can't pass the enemy. In the air: every square costs 1,
// anything can be flown over, and a plane can't go further than its fuel.
function reach(u) {
  const out = new Map(), R = UNITS[u.type];
  if (R.fixed || u.moved) return out;
  const air = !!R.air, lay = layerOf(u);
  const budget = R.air === 'plane' ? Math.min(R.spd, Math.max(0, u.fuel)) : R.spd;
  const best = new Map([[u.x + ',' + u.y, 0]]), q = [[u.x, u.y, 0]];
  while (q.length) {
    q.sort((a, b) => a[2] - b[2]);
    const [x, y, c] = q.shift();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!inMap(nx, ny)) continue;
      const nc = c + (air ? 1 : moveCost(tileAt(nx, ny)));
      if (nc > budget) continue;
      const o = unitAt(nx, ny, lay);
      if (!air && o && o.side !== u.side) continue;
      const k = nx + ',' + ny;
      if (best.has(k) && best.get(k) <= nc) continue;
      best.set(k, nc); q.push([nx, ny, nc]);
      if (!o) out.set(k, { x: nx, y: ny });
    }
  }
  return out;
}
function targetsFrom(u, x, y) {
  if (u.acted || u.reloading) return [];
  const R = UNITS[u.type];
  return G.units.filter(o => o.side !== u.side && canHit(R, o) && Math.abs(o.x - x) + Math.abs(o.y - y) <= R.rng);
}
function income(side) {
  return G.cities.filter(c => c.owner === side).reduce((s, c) => s + (c.hq ? HQ_MONEY : CITY_MONEY), 0);
}
function startTurn(side) {
  G.side = side;
  const got = income(side);
  G.money[side] += got;
  const notes = [];
  for (const u of G.units.filter(u => u.side === side)) {
    u.moved = false; u.acted = false; u.fresh = false;
    if (UNITS[u.type].air === 'plane') {
      if (u.landed) u.fuel = FUEL;
      else if (!u.flew) u.fuel -= CIRCLE;   // circling in place still burns fuel; only helicopters can hover
      u.flew = false;
    }
    // the artillery gun reloads through the turn after it fires
    u.reloading = u.reload > 0;
    if (u.reloading) { u.reload--; u.acted = u.moved = true; }
    if (u.burn > 0) {
      u.burn--; u.hp = Math.round((u.hp - BURN) * 10) / 10;
      fx.push({ kind: 'num', x: u.x, y: u.y, text: '-' + fmt(BURN), t0: performance.now(), dur: 900 });
    }
  }
  for (const u of G.units.filter(u => u.side === side)) {
    if (UNITS[u.type].air === 'plane' && !u.landed && u.fuel <= 0) notes.push(remove(u, 'crashed'));
    else if (u.hp <= 0) notes.push(remove(u, 'burnedOut'));
  }
  if (side === 'you') {
    sel = null;
    showBanner(t('yourTurn', { m: fmt(got) }));
    log([t('yourTurn', { m: fmt(got) }), ...notes].join(' '));
    save();
  }
  checkEnd();
  render();
}
// Takes a unit off the map with a boom, counts it, and returns the line to show.
function remove(u, why) {
  G.units = G.units.filter(o => o !== u);
  fx.push({ kind: 'boom', x: u.x, y: u.y, t0: performance.now() + 220, dur: 600 });
  setTimeout(() => sfx('boom'), 220);
  if (u.side === 'cpu') G.stats.killed++; else G.stats.lost++;
  if (sel?.unit === u) sel = null;
  return why === 'knocked' ? t('knocked', { b: UNITS[u.type].name.toLowerCase() }) : t(why, { unit: UNITS[u.type].name.toLowerCase() });
}
// Units face up, down, left or right only. Decided 4 Nov: turned at in-between
// angles, his drawings came out jagged.
const face = (dx, dy) => Math.round(Math.atan2(dx, -dy) / (Math.PI / 2)) * (Math.PI / 2);
function moveUnit(u, x, y) {
  const R = UNITS[u.type];
  if (R.air === 'plane') { u.fuel -= dist(u, { x, y }); u.flew = true; }
  u.ang = face(x - u.x, y - u.y);
  u.x = x; u.y = y; u.moved = true;
  const c = cityAt(x, y);
  if (R.air === 'plane') u.landed = !!(c && c.owner === u.side);
  // only ground units take cities
  if (!R.air && c && c.owner !== u.side) {
    const was = c.owner; c.owner = u.side;
    const msgs = [];
    if (u.side === 'you') { G.stats.taken++; msgs.push(t('took')); sfx('take'); }
    else if (was === 'you') { msgs.push(t('lostCity')); sfx('lose'); }
    for (const p of G.units.filter(p => p.x === x && p.y === y && p.landed && p.side !== u.side)) msgs.push(remove(p, 'caught'));
    if (msgs.length) log(msgs.join(' '));
  }
  checkEnd();
}
function fire(a, b) {
  const R = UNITS[a.type], d = dmgTo(R, b), wasAir = isAir(b);
  a.ang = face(b.x - a.x, b.y - a.y);
  a.acted = true; a.moved = true;
  if (R.reload) a.reload = 1;
  b.hp = Math.round((b.hp - d) * 10) / 10;
  fx.push({ kind: 'shot', x0: a.x, y0: a.y, x1: b.x, y1: b.y, t0: performance.now(), dur: 260 });
  fx.push({ kind: 'num', x: b.x, y: b.y, text: '-' + fmt(d), t0: performance.now() + 200, dur: 900 });
  sfx('shot');
  let msg = t('hit', { a: R.name, b: UNITS[b.type].name.toLowerCase() });
  if (b.hp <= 0) msg += ' ' + remove(b, 'knocked');
  else if (R.fire && !wasAir) { b.burn = BURN_TURNS; msg += ' ' + t('onFire'); }
  log(msg);
  checkEnd();
}
function alive(side) { return G.units.some(u => u.side === side) || G.cities.some(c => c.owner === side); }
function checkEnd() {
  if (G.over) return;
  const all = s => G.cities.every(c => c.owner === s);
  if (all('you') || !alive('cpu')) end(true, all('you') ? 'wonAll' : 'wonLast');
  else if (all('cpu') || !alive('you')) end(false);
}
function end(won, why) {

  const extra = R.air === 'plane' ? `<dt>${t('fuel')}</dt><dd>${t('fuelOf', { n: fmt(Math.max(0, u ? u.fuel : FUEL)), max: FUEL })}</dd>` : R.air === 'heli' ? `<dt>${t('fuel')}</dt><dd>${t('hovers')}</dd>` : '';
  return `<dl class="stats"><dt>${t('hp')}</dt><dd>${hp === undefined ? fmt(R.hp) : t('hpOf', { n: fmt(Math.max(0, hp)), max: fmt(R.hp) })}</dd><dt>${t('dmg')}</dt><dd>${dmg}</dd>${extra}
    <dt>${t('rng')}</dt><dd>${t('spaces', { n: R.rng })}</dd><dt>${t('spd')}</dt><dd>${R.fixed ? t('staysPut') : t('spaces', { n: R.spd })}</dd>
    <dt>${t('cost')}</dt><dd>${fmt(R.cost)}</dd><dt>${t('hits')}</dt><dd>${hits}</dd></dl>`;
}
function panel() {
  const el = $('#info');
  if (!sel) { el.innerHTML = `<h2>${t('title')}</h2><p>${t('pickHint')}</p>`; return; }
  if (sel.unit) {
    const u = sel.unit, R = UNITS[u.type];
    let tip = '';
    const notes = [];
    if (u.burn > 0) notes.push(t('burning', { n: u.burn }));
    if (u.reloading) notes.push(t('reloading'));
    if (R.air === 'plane' && u.landed) notes.push(t('landed'));
    else if (R.air === 'plane' && u.fuel <= 4) notes.push(t('lowFuel'));
    if (u.side === 'you' && G.side === 'you') {
      if (u.fresh) tip = t('newUnit');
      else if (u.moved && u.acted) tip = t('done');
      else { const m = reach(u).size, f = targetsFrom(u, u.x, u.y).length; tip = [m ? t('canMove') : '', f ? t('canFire') : ''].filter(Boolean).join(' ') || t('done'); }
    }
    el.innerHTML = `<h2>${R.name} · ${t(u.side === 'you' ? 'yours' : 'enemy')}</h2>
      ${statsHTML(u.type, u.hp, u)}${notes.map(n => `<p>${n}</p>`).join('')}${tip ? `<p>${tip}</p>` : ''}${u.side === 'you' && cityAt(u.x, u.y)?.owner === 'you' ? `<p>${t('cityAgain')}</p>` : ''}`;
    return;
  }
  const c = sel.city;
  const name = c.hq ? t(c.owner === 'you' ? 'hqYours' : 'hqEnemy') : t(c.owner === 'you' ? 'cityYours' : c.owner === 'cpu' ? 'cityEnemy' : 'cityFree');
  let body = `<p>${t('cityGives', { m: c.hq ? HQ_MONEY : CITY_MONEY })}</p>`;
  if (c.owner !== 'you') body += `<p>${t('cityTake')}</p>`;
  else if (!spot(c, 'ground') && !spot(c, 'air')) body += `<p>${t('cityBusy')}</p>`;
  else {
    body += `<p>${t('buyHere')}</p>` + SHOP_GROUPS.map(([g, list]) => `<p class="grp">${t(g)}</p><div class="shop">` + list.map(k => {
      const R = UNITS[k], poor = G.money.you < R.cost, full = !spot(c, layerOfType(k));
      return `<button class="buy" data-buy="${k}" ${poor || full || G.side !== 'you' ? 'disabled' : ''}><img src="units/${R.img}.png" alt=""><span>${R.name}</span><b>${full ? t('noRoom') : poor ? t('need', { m: fmt(R.cost) }) : fmt(R.cost)}</b></button>`;
    }).join('') + '</div>').join('');
  }
  el.innerHTML = `<h2>${name}</h2>${body}`;
  el.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b.dataset.buy));
}
function log(s) { $('#log').textContent = s; }

// ---------- sound ----------
let ac = null;
function sfx(kind) {
  if (!PREFS.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const tone = (f, d, type = 'square', v = .06, at = 0, f2) => {
      const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + at;
      o.type = type; o.frequency.setValueAtTime(f, s); if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
      g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.0001, s + d);
      o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d);
    };
    const noise = (d, v = .12, at = 0) => {
      const b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), ch = b.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
      const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = v; s.connect(g); g.connect(ac.destination); s.start(ac.currentTime + at);
    };
    if (kind === 'click') tone(520, .05);
    if (kind === 'step') tone(180, .06, 'triangle', .05);
    if (kind === 'shot') { noise(.12, .15); tone(300, .1, 'square', .04, 0, 90); }
    if (kind === 'boom') { noise(.5, .25); tone(90, .45, 'sawtooth', .06, 0, 40); }
    if (kind === 'buy') { tone(440, .08); tone(660, .1, 'square', .05, .08); }
    if (kind === 'take') { tone(392, .1); tone(523, .1, 'square', .06, .1); tone(659, .18, 'square', .06, .2); }
    if (kind === 'win') [392, 523, 659, 784].forEach((f, i) => tone(f, .2, 'square', .06, i * .15));
    if (kind === 'lose') [330, 262, 196].forEach((f, i) => tone(f, .25, 'triangle', .07, i * .2));
  } catch (e) { }
}
function hud() { const b = $('#soundBtn'); b.textContent = PREFS.sound ? t('soundOn') : t('soundOff'); b.setAttribute('aria-label', t('soundLabel')); b.title = t('soundLabel'); }

// ---------- cards ----------
function cardShow(html) { $('#card').innerHTML = html; $('#cover').hidden = false; const f = $('#card').querySelector('.row button:last-child, .row .btn:last-child'); f && f.focus(); }
function cardHide() { $('#cover').hidden = true; cv.focus(); }
function titleCard() {
  const saved = read().game;
  cardShow(`<h1>${t('title')}</h1><p>${t('intro')}</p><ul><li>${t('how1')}</li><li>${t('how2')}</li><li>${t('how3')}</li><li>${t('how4')}</li><li>${t('how5')}</li><li>${t('how6')}</li></ul>
    <div class="row">${saved ? `<button class="btn quiet" id="fresh">${t('newGame')}</button><button class="btn" id="go">${t('keepPlaying')}</button>` : `<button class="btn" id="go">${t('start')}</button>`}</div>`);
  $('#go').onclick = () => { cardHide(); if (saved) resume(saved); else newGame(); };
  const f = $('#fresh');
  if (f) f.onclick = () => {
    cardShow(`<p>${t('newSure')}</p><div class="row"><button class="btn quiet" id="no">${t('cancel')}</button><button class="btn" id="yes">${t('startNew')}</button></div>`);
    $('#no').onclick = titleCard; $('#yes').onclick = () => { cardHide(); newGame(); };
  };
}
function resume(s) {
  G = s; uid = Math.max(0, ...G.units.map(u => u.id)) + 1;
  for (const u of G.units) { u.px = u.x; u.py = u.y; }
  sel = null; log(t('pickHint')); render();
}

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  const b = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - b.left) / b.width * MW), y = Math.floor((e.clientY - b.top) / b.height * MH);
  tapTile(x, y);
});
cv.addEventListener('keydown', e => {
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (d) { cursor.x = Math.max(0, Math.min(MW - 1, cursor.x + d[0])); cursor.y = Math.max(0, Math.min(MH - 1, cursor.y + d[1])); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { tapTile(cursor.x, cursor.y); e.preventDefault(); }
  else if (e.key === 'Escape') { sel = null; render(); }
});
$('#endBtn').onclick = () => { if (!busy && G && G.side === 'you' && !G.over) { sel = null; cpuTurn(); } };
$('#soundBtn').onclick = () => { PREFS.sound = !PREFS.sound; const s = read(); s.prefs = PREFS; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } hud(); };
$('#backLink').textContent = t('back');
hud();
loadArt().then(() => { paintGround(); requestAnimationFrame(frame); titleCard(); });
</script>
</body>
</html>
