<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conquest · Rubber Duck Games</title>
<meta name="description" content="A turn-based war game for up to five teams: move your army, make allies, take the cities and win the map.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="game.css">
<script src="../shared/no-menu.js"></script>
<script src="../shared/menu.js"></script>
</head>
<body>
<div class="bar">
  <a class="pill" href="../" id="backLink"></a>
  <span class="grow"></span>
  <span class="pill" id="hTeam"></span>
  <span class="pill" id="hTurn"></span>
  <span class="pill" id="hMoney"></span>
  <button class="pill" id="inviteBtn" hidden></button>
  <button class="pill" id="teamsBtn"></button>
  <button class="pill" id="helpBtn">?</button>
  <button class="pill" id="soundBtn"></button>
</div>
<main class="game">
  <div class="mapbox" id="mapbox"><canvas id="cv" width="960" height="768" tabindex="0"></canvas>
    <div class="zoom"><button class="pill" id="zIn">+</button><button class="pill" id="zOut">−</button></div></div>
  <div class="side">
    <section class="info" id="info" aria-live="polite"></section>
    <p class="log" id="log" aria-live="polite"></p>
    <div class="actions"><button class="btn" id="endBtn"></button></div>
  </div>
</main>
<div class="cover" id="cover"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<script src="../shared/kit.js"></script>
<script src="game.js"></script>
</body>
</html>
