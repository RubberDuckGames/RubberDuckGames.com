<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bread the Corgi · Rubber Duck Games</title>
<meta name="description" content="Bread the corgi rides to the pond to chase off squirrels and fleas, find treats and win costumes.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--soft:#7a6450;--bg:#fff4e0;--panel:#fffdf7;--line:#ead7b8;--accent:#e8913a;--green:#3f9d5d;--gold:#f5b700;font-family:Lexend,Verdana,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}
body{font-size:1.125rem;line-height:1.45;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:0.625rem;padding:0.625rem 0.875rem;max-width:62.5rem;margin:0 auto}
.bar h1{font-size:1.375rem;margin:0;flex:1;letter-spacing:.03em}
.bar h1 b{color:var(--accent)}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:0.375rem 0.875rem;font-weight:700;white-space:nowrap;text-decoration:none;color:inherit}
.wrap{max-width:62.5rem;margin:0 auto;padding:0 0.875rem 1.25rem}
.stagebox{position:relative;margin:0 auto;max-width:100%}
canvas{display:block;width:100%;border-radius:18px;background:#8fd17a;box-shadow:0 0 0 3px var(--line),0 8px 24px rgba(90,60,20,.18);touch-action:none}
.toast{position:absolute;top:0.75rem;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.96);border:2px solid var(--accent);border-radius:999px;padding:0.375rem 1rem;font-weight:700;z-index:5;pointer-events:none;max-width:92%;text-align:center}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(60,40,20,.45);border-radius:18px;z-index:6;padding:0.875rem}
.card{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:1.25rem;max-width:32.5rem;width:100%;text-align:center;max-height:100%;overflow:auto}
.card h2{margin:0 0 0.375rem;font-size:1.75rem}
.card p{margin:0.375rem 0;color:var(--soft)}
.card .big{font-size:1.375rem;font-weight:800;color:var(--ink)}
.trow{display:flex;justify-content:space-between;gap:1rem;max-width:22rem;margin:0.5rem auto;color:var(--ink);visibility:hidden}
.trow.on{visibility:visible}
.trow b,.pct b{font-family:"Press Start 2P",monospace}
.pct{visibility:hidden}.pct.on{visibility:visible}
.found{display:flex;flex-wrap:wrap;gap:0.375rem;justify-content:center;margin:0.625rem 0}
.found span{border:2px solid var(--line);border-radius:999px;padding:0.25rem 0.75rem;font-size:0.9375rem;font-weight:700}
.found .yes{border-color:var(--green);color:var(--green)}
.found .tile{display:inline-block;padding:.3rem;border-radius:0}
.found .tile.on{box-shadow:none}
.found .no{color:var(--soft)}
.row{display:flex;gap:0.625rem;justify-content:center;flex-wrap:wrap;margin-top:0.75rem}
.btn{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:0.75rem 1.25rem;font-weight:800;font-size:1.25rem}
.btn:hover{border-color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.btn[disabled]{opacity:.45;cursor:default}
.btn small{display:block;font-weight:400;font-size:0.875rem;color:var(--soft)}
.btn.go small{color:#fff3e0}
.panelbox{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:0.75rem 0.875rem;margin-top:0.75rem}
.panelbox h3{margin:0 0 0.375rem;font-size:1.25rem}
.panelbox .row{justify-content:flex-end}
/* Decided 28 Oct: on a touch screen there's no keyboard, so an arrow pad like
   a Game Boy's sits on the left (holding the game where Bread should go still
   works too). It only shows on touch screens. */
.pad{display:none;grid-template-columns:repeat(3,3.25rem);grid-template-rows:repeat(3,3.25rem);gap:.15rem;margin-right:auto}
@media (pointer:coarse){.pad{display:grid}}
.pad{touch-action:none}
.pad .btn{padding:0;font-family:Lexend,Verdana,sans-serif;font-size:1.25rem;line-height:1;touch-action:none;pointer-events:none}
.pad .btn.on{transform:translate(.15rem,.15rem);box-shadow:none}
.pad [data-k=arrowup]{grid-area:1/2}.pad [data-k=arrowleft]{grid-area:2/1}.pad [data-k=arrowright]{grid-area:2/3}.pad [data-k=arrowdown]{grid-area:3/2}
#levelBtns{align-items:flex-end}
.acts{display:contents}
@media (pointer:coarse) and (min-width:43.76rem) and (orientation:portrait){#levelBtns{left:1rem}}
/* Decided 28 Oct: a phone turned sideways plays like a Switch. The game sits
   in the middle; the thumb pad is on a dark controller on the left, and Paw,
   Bark and Dig are round buttons in a diamond on a dark controller on the
   right. Our own colors, not Nintendo's. */
@media (pointer:coarse) and (orientation:landscape){
  html,body{background:#202230}
  canvas{border:3px solid #111}
  #levelBtns{position:fixed;inset:0;display:block;margin:0;pointer-events:none;z-index:7}
  #levelBtns>*,#levelBtns .acts>*{pointer-events:auto}
  .pad,.acts{position:fixed;top:50%;transform:translateY(-50%);background:#33364a;border-radius:2.5rem;padding:1rem .7rem;box-shadow:inset 0 0 0 3px #262839}
  .pad{left:.6rem;grid-template-columns:repeat(3,3rem);grid-template-rows:repeat(3,3rem);gap:0;margin:0}
  .pad .btn{background:#1d1f2b;color:#cfd1dc;border:0;border-radius:.3rem;box-shadow:0 .2rem 0 #111}
  .acts{right:.6rem;display:grid;grid-template-columns:repeat(3,3rem);grid-template-rows:repeat(3,3rem);gap:0}
  #pawBtn{grid-area:2/3}#barkBtn{grid-area:3/2}#digBtn{grid-area:2/1}
  #barkBtn,#pawBtn,#digBtn{width:3.4rem;height:3.4rem;margin:-.2rem;border-radius:50%;padding:0;background:#a3244a;border:0;color:#fff;font-size:.45rem;box-shadow:0 .25rem 0 #6e1631}
  #levelBtns>[data-home]{position:fixed;right:.8rem;bottom:.6rem;border-radius:999px;font-size:.5rem;padding:.4rem .8rem}
}
/* Arrows are drawn shapes, not ◀ ▶ characters: iPhones turn those two into
   blue emoji boxes but leave ▲ ▼ alone, so the pad came out mismatched. */
.tri{width:1.1rem;height:1.1rem;fill:currentColor;display:block;margin:auto}
#backBtn,#onBtn{font-family:Lexend,Verdana,sans-serif;font-size:1.5rem;line-height:1;min-width:3.75rem}   /* the map arrows, big enough for a finger */
/* Decided 28 Oct: the closet is something to look through, not a list of
   words. A mirror shows Bread in the outfit; each spot is a wooden shelf of
   pictures; things not found yet are dark shapes with a ? (tap one for where
   to look). The words stay as labels for screen readers. */
#closet.panelbox{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(52rem,calc(100vw - 2rem));max-height:calc(100vh - 2rem)}
.wardrobe{display:grid;grid-template-columns:minmax(9rem,14rem) 1fr;gap:1rem;align-items:start}
.mirror{background:#b07a46;border:4px solid #3b2a1a;padding:.6rem;box-shadow:inset 0 0 0 4px #d9a86c}
.mirror img{display:block;width:100%;background:linear-gradient(#e8f6ff,#bfe8ff);image-rendering:pixelated;aspect-ratio:1}
.racks{display:grid;gap:.5rem 1rem;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))}
.rack{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;padding:.35rem .4rem .55rem;background:linear-gradient(transparent calc(100% - .45rem),#b07a46 0);border-bottom:3px solid #3b2a1a}
.rack .lbl{font-family:"Press Start 2P",monospace;font-size:.55rem;color:var(--soft);width:100%}
.tile{width:4.25rem;height:4.25rem;padding:.3rem;background:var(--panel);border:3px solid var(--line);box-shadow:.2rem .2rem 0 var(--line)}
.tile img{display:block;width:100%;height:100%;image-rendering:pixelated}
.tile.on{border-color:var(--green);box-shadow:0 0 0 3px var(--green)}
.tile.locked{background:#e9dcc6}
@media (max-width:43.75rem){.wardrobe{grid-template-columns:1fr}.mirror{width:100%;max-width:12rem;margin:0 auto}}
@media (max-width:43.75rem) and (orientation:portrait){#closet.panelbox{position:static;transform:none;width:auto;max-height:none}}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem;margin:0.375rem 0}
.slot b{min-width:5.625rem}
.slot .btn{font-size:1rem;padding:0.5rem 0.875rem}
/* Decided 28 Oct: full screen, like Math Force. The top bar and the buttons
   float over the world, a level's goal shows when it changes, and the controls
   are behind the ? button instead of a line under the game. */
.bar{position:fixed;top:0;left:0;right:0;z-index:8;max-width:none;pointer-events:none}
.bar>*{pointer-events:auto}
.bar h1{visibility:hidden}
.wrap{max-width:none;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0}
canvas{box-shadow:none}
#homeBtns,#mapBtns,#levelBtns{position:fixed;right:1rem;bottom:1rem;z-index:7;justify-content:flex-end;margin:0}
#closet,#shop{position:fixed;right:1rem;bottom:1rem;z-index:9;width:min(30rem,calc(100vw - 2rem));max-height:calc(100vh - 5rem);overflow:auto;margin:0}
.tops{position:absolute;top:3.75rem;left:1rem;right:1rem;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none}
.tops .toast{position:static;transform:none}
.goal{background:#3b2a1a;color:#fff6ea;font-family:"Press Start 2P",monospace;font-size:.7rem;line-height:1.6;padding:.5rem .9rem;box-shadow:.25rem .25rem 0 rgba(0,0,0,.25);text-align:center}
.info{display:flex;align-items:center;gap:.75rem;width:100%;max-width:46rem;background:var(--panel);border:4px solid var(--line);padding:.6rem .75rem .6rem 1rem;pointer-events:auto;box-shadow:.25rem .25rem 0 rgba(90,52,24,.25)}
.info p{margin:0;flex:1;font-size:1rem;color:var(--soft)}
.info b{color:var(--ink)}
/* On a phone held upright the world is a short strip, so the bar and the
   buttons go back above and below it instead of covering it. */
@media (max-width:43.75rem) and (orientation:portrait){
  .bar{position:static;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  .bar .pill:first-child{margin-right:auto}
  .bar h1{display:none}
  .wrap{display:block;min-height:0;padding:0 .875rem 1.25rem}
  #homeBtns,#mapBtns,#levelBtns,#closet,#shop{position:static;width:auto;max-height:none}
  #closet,#shop{margin-top:.75rem}
  #homeBtns,#mapBtns,#levelBtns{margin-top:.75rem}
  /* messages sit in a text box at the bottom of the game screen, like an old
     handheld game. Below the screen, each one pushed the buttons down and
     back up again as it came and went. */
  .tops{top:auto;bottom:.5rem;left:.5rem;right:.5rem;gap:.3rem}
  .tops .toast,.goal{font-size:.8rem;padding:.35rem .6rem;max-width:100%}
  .info p{font-size:.85rem}
  /* the world is a short strip here, so the cards (who's playing, the
     results, the nap) cover the whole screen and scroll instead of being
     cut off inside it (seen on an iPhone) */
  .cover{position:fixed;inset:0;z-index:20;border-radius:0;align-items:flex-start;overflow:auto;padding:1rem}
  .card{max-height:none;margin:auto 0}
}
/* Decided 28 Oct: on a phone held upright, Bread looks like a Game Boy. The
   game sits in a dark screen frame, the arrow pad is a black cross on the
   left, and Paw, Bark and Dig are round red buttons on the right. */
@media (max-width:43.75rem) and (orientation:portrait) and (pointer:coarse){
  html,body{background:#c9c4b8}
  .bar .pill{background:#e2ddd2;border-color:#a8a294;box-shadow:.2rem .2rem 0 #a8a294}
  .stagebox{background:#4a4a58;padding:.9rem .9rem 1.6rem;border-radius:.6rem .6rem 2.4rem .6rem;box-shadow:inset 0 0 0 3px #3a3a46}
  .stagebox::after{content:"BREAD";position:absolute;left:1rem;bottom:.35rem;font-family:"Press Start 2P",monospace;font-size:.5rem;color:#b9b9c9;letter-spacing:.1em}
  canvas{border:3px solid #2a2a33}
  .tops{bottom:2.1rem;left:1.3rem;right:1.3rem}   /* inside the screen, above the frame's bottom edge */
  #levelBtns{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"pad acts" "home home";align-items:center;gap:1rem}
  .pad{grid-area:pad;gap:0;grid-template-columns:repeat(3,3.4rem);grid-template-rows:repeat(3,3.4rem);margin:0}
  .pad .btn{background:#2a2a33;color:#c9c4b8;border:0;box-shadow:0 .25rem 0 #15151b;border-radius:.3rem}
  .pad .btn.on{transform:translateY(.15rem);box-shadow:0 .1rem 0 #15151b}
  #barkBtn,#pawBtn,#digBtn{width:4.4rem;height:4.4rem;border-radius:50%;padding:0;background:#a3244a;border:0;color:#fff;font-size:.55rem;box-shadow:0 .3rem 0 #6e1631}
  #barkBtn:active,#pawBtn:active,#digBtn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 #6e1631}
  #levelBtns>[data-home]{grid-area:home;justify-self:center;border-radius:999px;background:#8f8a80;border:0;color:#fff;font-size:.55rem;padding:.5rem 1.1rem;box-shadow:0 .2rem 0 #6f6b63}
  .acts{grid-area:acts;display:flex;justify-content:flex-end;align-items:flex-start;gap:.7rem;flex-wrap:wrap}
  #barkBtn{margin-top:1.8rem}   /* staggered, like the A and B buttons */
}
@media (max-width:37.5rem){.bar h1{font-size:1.125rem}.btn{font-size:1.0625rem;padding:0.625rem 0.875rem}.toast{font-size:0.875rem}}
/* 8-bit look: pixel font for buttons and titles, square corners, chunky
   borders with a hard shadow. Longer sentences stay in Lexend so they're easy
   to read. */
.bar h1,.btn,.pill,.card h2,.panelbox h3,.found span{font-family:"Press Start 2P",monospace;letter-spacing:0}
.bar h1{font-size:1rem}
.pill,.btn,.card,.panelbox,.toast,.found span,canvas{border-radius:0}
.btn,.pill{font-size:.75rem;line-height:1.6;box-shadow:.25rem .25rem 0 var(--line)}
.btn{border-width:4px;padding:.8rem 1rem}
.btn small{font-family:Lexend,Verdana,sans-serif;font-size:.85rem;margin-top:.3rem}
.btn:active{transform:translate(.15rem,.15rem);box-shadow:.1rem .1rem 0 var(--line)}
.card,.panelbox{border-width:4px;box-shadow:.4rem .4rem 0 rgba(90,52,24,.25)}
.card h2{font-size:1.1rem;line-height:1.6}
.panelbox h3{font-size:.9rem}
.found span{font-size:.6rem;line-height:1.8}
canvas{image-rendering:pixelated;box-shadow:0 0 0 4px var(--line),.5rem .5rem 0 rgba(90,52,24,.2)}
.toast{border-width:3px}
</style>
</head>
<body>
<div class="bar">
  <a class="pill" href="../">← All games</a>
  <h1><b>BREAD</b> THE CORGI</h1>
  <button class="pill" id="whoBtn" hidden></button>
  <span class="pill" id="hBank" aria-label="Treats">🦴 0</span>
  <button class="pill" id="helpBtn" hidden aria-label="How to play" aria-expanded="false" aria-controls="info">?</button>
  <button class="pill" id="soundBtn" aria-label="Sounds on or off" title="Sounds on or off">🔔</button>
</div>
<div class="wrap">
  <div class="stagebox" id="box">
    <canvas id="cv"></canvas>
    <div class="tops">
      <div class="info" id="info" hidden>
        <p><b id="infoGoal"></b> Walk: <b>arrows</b>, <b>WASD</b>, the arrow pad or hold the mouse · Bark: <b>Space</b> · Paw: <b>P</b><span id="digHelp" hidden> · Dig: <b>X</b></span> · Help: <b>H</b></p>
        <button class="pill" id="infoClose" aria-label="Close help">✕</button>
      </div>
      <div class="goal" id="goal" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="cover" id="cover"><div class="card" id="card">
      <h2>Bread the Corgi</h2>
      <p>Bread is a corgi (such a loaf). Her puppy pal Crumb keeps running off. Find Crumb and win costumes!</p>
      <p class="big">Who's playing?</p>
      <div id="who"></div>
    </div></div>
  </div>

  <div class="row" id="homeBtns" hidden>
    <button class="btn" id="closetBtn">👕 Closet</button>
    <button class="btn" id="shopBtn">🦴 Treat shop</button>
    <button class="btn go" id="rideBtn">🚗 Go for a ride</button>
  </div>
  <div class="panelbox" id="closet" hidden>
    <h3>Closet</h3>
    <div class="wardrobe">
      <div class="mirror"><img id="mirror" alt="Bread in the mirror"></div>
      <div id="closetList" class="racks"></div>
    </div>
    <div class="row"><button class="btn go" data-done>Done</button></div>
  </div>
  <div class="panelbox" id="shop" hidden>
    <h3>Treat shop</h3>
    <div id="shopList"></div>
    <div class="row"><button class="btn go" data-done>Done</button></div>
  </div>
  <div class="row" id="mapBtns" hidden>
    <button class="btn" id="backBtn" aria-label="Drive back"><svg class="tri" viewBox="0 0 10 10" aria-hidden="true" style="transform:rotate(-90deg)"><path d="M5 1.5 9 8.5H1z"/></svg></button>
    <button class="btn" id="onBtn" aria-label="Drive on"><svg class="tri" viewBox="0 0 10 10" aria-hidden="true" style="transform:rotate(90deg)"><path d="M5 1.5 9 8.5H1z"/></svg></button>
    <button class="btn go" id="inBtn">Go in</button>
  </div>
  <div class="row" id="levelBtns" hidden>
    <div class="pad" id="pad" aria-label="Arrow pad">
      <button class="btn" data-k="arrowup" aria-label="Up"><svg class="tri" viewBox="0 0 10 10" aria-hidden="true" style="transform:rotate(0deg)"><path d="M5 1.5 9 8.5H1z"/></svg></button>
      <button class="btn" data-k="arrowleft" aria-label="Left"><svg class="tri" viewBox="0 0 10 10" aria-hidden="true" style="transform:rotate(-90deg)"><path d="M5 1.5 9 8.5H1z"/></svg></button>
      <button class="btn" data-k="arrowright" aria-label="Right"><svg class="tri" viewBox="0 0 10 10" aria-hidden="true" style="transform:rotate(90deg)"><path d="M5 1.5 9 8.5H1z"/></svg></button>
      <button class="btn" data-k="arrowdown" aria-label="Down"><svg class="tri" viewBox="0 0 10 10" aria-hidden="true" style="transform:rotate(180deg)"><path d="M5 1.5 9 8.5H1z"/></svg></button>
    </div>
    <div class="acts">
      <button class="btn go" id="barkBtn">🐶 Bark</button>
      <button class="btn go" id="pawBtn">🐾 Paw</button>
      <button class="btn go" id="digBtn" hidden>⛏️ Dig</button>
    </div>
    <button class="btn" data-home>🏠 Go home</button>
  </div>
</div>

<script src="../shared/players.js"></script>
<script>
// Bread the Corgi. Decided 27-28 Oct, designed by the middle kid tester: Bread
// rides in the car from home to a small world, chases off the squirrels and
// fleas, picks up treats (the money) and finds her lost toy. Beating a world
// wins that animal's costume, just for fun. Every world can be played again for
// the extra pieces, the hidden sparkles and the gold paw print; finding all of them
// is 100% and wins the trophy.
const $ = s => document.querySelector(s);
// Decided 28 Oct: 8-bit. Everything is drawn on a small canvas, 16 pixels to a
// tile, then scaled up with smoothing off so the pixels show as hard blocks.
// The first try at 20 pixels still looked fuzzy: the canvas softens every edge
// with in-between colors. So each frame, every pixel snaps to the nearest color
// in the game's own palette (the colors written in this file), which leaves
// only hard edges.
const cv = $('#cv'), out = cv.getContext('2d');
const VW = 18, VH = 11;                       // the view, in tiles
const T = 16;
const lo = document.createElement('canvas'); lo.width = VW * T; lo.height = VH * T;
const cx = lo.getContext('2d');
const PIX = '"Press Start 2P", monospace';
const PALETTE = [...new Set(document.currentScript.textContent.match(/#[0-9a-f]{6}\b/gi))].map(h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)));
const snapCache = new Map();
function snap() {
  const img = cx.getImageData(0, 0, lo.width, lo.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const key = d[i] << 16 | d[i + 1] << 8 | d[i + 2];
    let c = snapCache.get(key);
    if (!c) {
      let best = 1e9;
      for (const q of PALETTE) { const e = (q[0] - d[i]) ** 2 * 3 + (q[1] - d[i + 1]) ** 2 * 4 + (q[2] - d[i + 2]) ** 2 * 2; if (e < best) { best = e; c = q; } }
      snapCache.set(key, c);
    }
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
}

// ---------- Saved progress (this browser only) ----------
// Decided 28 Oct: one save per player, using the players shared by every game
// (shared/players.js). Sound is one setting for the whole computer, so it has
// its own key and isn't part of a player's save.
const KEY = 'bread-corgi', SOUND = 'bread-corgi-sound';
const DEF = { bank: 0, have: [], wear: {}, pond: {}, farm: {}, toys: [], moves: {} };   // moves: what Bread has learned (dig)
const soundOn = () => { try { return localStorage.getItem(SOUND) !== 'off'; } catch (e) { return true; } };
const S = Object.assign(structuredClone(DEF), { sound: soundOn() });
let me = null;
function usePlayer(p) {
  me = p;
  const data = Players.load(KEY, p.id) || {};
  try { if (data.sound === false && localStorage.getItem(SOUND) === null) localStorage.setItem(SOUND, 'off'); } catch (e) { }
  delete data.sound;
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, structuredClone(DEF), data, { sound: soundOn() });
  $('#whoBtn').hidden = false;

    if (!card.isConnected) return;
    if (i < rows.length) { trows[i].classList.add('on'); const to = rows[i][1]; count(trows[i].querySelector('b span'), to, Math.max(1, Math.ceil(to / 12)), n => n, () => row(i + 1)); return; }
    pcts.forEach(p => p.classList.add('on'));
    count(pcts[0].querySelector('b'), pct, 4, n => n + '%', () => { sfx.win(); if (newTrophy) sfx.sparkle(); });
  };
  setTimeout(() => row(0), 400);
  $('#homeRide').onclick = () => {
    $('#cover').hidden = true;
    drive(W.stop, 0, () => goHome(first ? `Try on the ${costume}!` : 'Home!'));
  };
}

// ---------- Input ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k) && screen !== 'title') e.preventDefault();
  keys[k] = true;
  if (screen === 'map' && !e.repeat) {
    // forward along the road is right or down, back is left or up
    if (k === 'arrowright' || k === 'arrowdown' || k === 'd' || k === 's') mapMove(1);
    if (k === 'arrowleft' || k === 'arrowup' || k === 'a' || k === 'w') mapMove(-1);
    if (k === 'enter' || k === ' ') { e.preventDefault(); mapGo(); }
    return;
  }
  if ((k === ' ' || k === 'b') && !e.repeat) bark();
  if ((k === 'p' || k === 'enter') && !e.repeat && screen === 'level') { e.preventDefault(); paw(); }
  if (k === 'h' && screen === 'level') help();
  if (k === 'x' && !e.repeat && screen === 'level') dig();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { Object.keys(keys).forEach(k => keys[k] = false); goal = null; });
const toView = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; };
cv.addEventListener('pointerdown', e => {
  const p = toView(e);
  if (screen === 'level') { goal = p; cv.setPointerCapture(e.pointerId); }
  else if (screen === 'drive' && ride) ride.t = 1;                      // tap to skip the ride
  else if (screen === 'home') {
    if (Math.abs(p.x - VW / 2) < 2.5 && p.y > 4.5 && p.y < 9.5) bark();   // pat Bread and she barks
    else if (p.x > 1 && p.x < 5.6 && p.y > 2 && p.y < 3.4 && S.toys.length) sfx.squeak();
  }
});
cv.addEventListener('pointermove', e => { if (goal) goal = toView(e); });
cv.addEventListener('pointerup', () => goal = null);
cv.addEventListener('pointercancel', () => goal = null);

const TITLE = $('#card').innerHTML;
function showTitle() {
  screen = 'title'; G = null; ride = null; showRow(null);
  $('#card').innerHTML = TITLE; $('#cover').hidden = false;
  Players.mount($('#who'), p => {
    usePlayer(p);
    $('#cover').hidden = true; resize();
    goHome(S.pond.beat ? `Hi, ${p.name}!` : 'This is Bread! Pat her, then go for a ride.');
  });
}
$('#whoBtn').onclick = showTitle;
showTitle();

// ---------- Main loop ----------
let last = 0;
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (screen === 'title' || screen === 'home') drawHome(t);
  else if (screen === 'map') drawMap(t);
  else if (screen === 'drive') {
    ride.t = Math.min(1, ride.t + dt / ride.dur);
    drawMap(t);
    if (ride.t >= 1) { const then = ride.then; ride = null; then(); }
  } else if (screen === 'level' && G) { if ($('#cover').hidden) stepLevel(dt, t); drawLevel(t); }
  snap();
  out.imageSmoothingEnabled = false;
  out.drawImage(lo, 0, 0, cv.width, cv.height);
  requestAnimationFrame(loop);
}
resize(); bank();
requestAnimationFrame(loop);
</script>
