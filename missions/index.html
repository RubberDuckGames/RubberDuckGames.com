<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Directive · Rubber Duck Games</title>
<meta name="description" content="Open the mission folder, pick your weapons, fly in, hit the target and fly out.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="game.css">
<script src="../shared/no-menu.js"></script>
<script src="../shared/menu.js"></script>
<script src="../shared/kit.js"></script>
</head>
<body>
<canvas id="cv" aria-label="The mission map"></canvas>
<div class="bar">
  <a class="pill" href="../">← All games</a>
  <span class="grow"></span>
  <span class="pill dir" id="dir" aria-live="polite" hidden></span>
  <button class="pill retreat" id="bRetreat" hidden>Retreat</button>
</div>
<div class="hud" id="hud" hidden>
  <span class="pill" id="hHp"></span>
  <span class="pill" id="hAmmo"></span>
  <span class="pill" id="hBoom"></span>
  <span class="pill alarm" id="hAlarm" hidden></span>
</div>
<div class="talk" id="talk" hidden role="status"><canvas id="talkFace" width="96" height="96" aria-hidden="true"></canvas><p id="talkText"></p></div>
<div class="cover" id="cover"><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div></div>
<div class="ctrl" id="ctrl">
  <div class="stick" id="stick" aria-hidden="true"><i id="knob"></i></div>
  <div class="acts">
    <button class="round use" id="bUse">Use</button>
    <button class="round fire" id="bFire">Fire</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
